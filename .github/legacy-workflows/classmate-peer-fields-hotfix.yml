name: Apply classmate peer profile fields hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/classmate-peer-fields-trigger.txt"
      - ".github/workflows/classmate-peer-fields-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch server public classmate profile fields
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('server.js')
          text = path.read_text(encoding='utf-8')
          if 'avatarUrl: peer.profile?.avatarUrl || ""' not in text:
              text = re.sub(
                  r'(school:\s*peer\.profile\?\.school \|\| "",\n)(\s*)sbId:\s*peer\.profile\?\.sbId \|\| ""',
                  r'\1\2major: peer.profile?.major || "",\n\2avatarUrl: peer.profile?.avatarUrl || "",\n\2backgroundUrl: peer.profile?.backgroundUrl || "",\n\2sbId: peer.profile?.sbId || ""',
                  text,
                  count=1
              )
          if 'avatarUrl: peer.profile?.avatarUrl || ""' not in text:
              raise SystemExit('publicClassmate peer profile block was not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify server syntax
        run: node --check server.js
      - name: Commit hotfix
        run: |
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add server.js
            git commit -m "Expose classmate public profile fields"
            git push
          fi
