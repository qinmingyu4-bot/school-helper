name: Add backend support for selectable community channels

on:
  push:
    paths:
      - ".github/workflows/community-directory-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch community channel backend
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          let server = fs.readFileSync('server.js', 'utf8');

          const start = server.indexOf('function communityChannelForUser(user, requestedType = "all") {');
          const end = server.indexOf('\nfunction publicCommunityPost(post, viewer) {', start);
          if (start === -1 || end === -1) throw new Error('communityChannelForUser block not found');

          const replacement = `function communityChannelForUser(user, requestedType = "all", requestedValue = "") {
  const channelType = String(requestedType || "all").toLowerCase();
  if (channelType === "school") {
    const school = String(requestedValue || user.profile?.school || "").trim();
    const schoolKey = communitySchoolKey(school);
    if (!schoolKey) throw new Error("Please choose a school channel first.");
    return { type: "school", label: school, key: communityChannelKey("school", school) };
  }
  if (channelType === "major") {
    const major = String(requestedValue || user.profile?.major || "").trim();
    const majorKey = communitySchoolKey(major);
    if (!majorKey) throw new Error("Please choose a major channel first.");
    return { type: "major", label: major, key: communityChannelKey("major", major) };
  }
  return { type: "all", label: "StudyBridge", key: "all" };
}
`;
          server = server.slice(0, start) + replacement + server.slice(end + 1);

          server = server.replaceAll(
            'communityChannelForUser(user, url.searchParams.get("channel") || "all");',
            'communityChannelForUser(user, url.searchParams.get("channel") || "all", url.searchParams.get("value") || "");'
          );
          server = server.replaceAll(
            'communityChannelForUser(user, body.channel || "all");',
            'communityChannelForUser(user, body.channel || "all", body.value || body.channelValue || "");'
          );

          fs.writeFileSync('server.js', server);
          NODE
          node --check server.js
          node --check public/school-community-patch.js
      - name: Commit backend hotfix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          git add server.js
          git commit -m "Support selectable school and major community channels"
          git push
