name: Force Weather Patch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply server patches
        run: |
          node .github/scripts/apply-weather-patch.js
          node .github/scripts/apply-learning-style-patch.js
          node --check server.js
      - name: Commit server patch
        run: |
          if git diff --quiet -- server.js; then
            echo "No server changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Enforce Learning Style in AI replies"
          git push
