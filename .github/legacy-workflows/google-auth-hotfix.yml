name: Apply StudyBridge Google auth hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Google login support
        run: |
          node <<'NODE'
          const fs = require("fs");

          const googleAuthPatchB64 = "";
          const helperB64 = "";
          const routesB64 = "";

          function decode(b64) {
            return Buffer.from(b64, "base64").toString("utf8");
          }

          fs.mkdirSync("public", { recursive: true });
          fs.writeFileSync("public/google-auth-patch.js", decode(googleAuthPatchB64), "utf8");

          let layout = fs.readFileSync("public/layout-fix.js", "utf8");
          if (!layout.includes("/google-auth-patch.js")) {
            layout = layout.replace(
              '  loadScriptOnce("/profile-onboarding-fix.js?v=20261005-1");',
              '  loadScriptOnce("/profile-onboarding-fix.js?v=20261005-1");\n  loadScriptOnce("/google-auth-patch.js?v=20261005-1");'
            );
            fs.writeFileSync("public/layout-fix.js", layout, "utf8");
          }

          let server = fs.readFileSync("server.js", "utf8");
          if (!server.includes("const googleClientId =")) {
            server = server.replace(
              /const solRoutePercent = Math\.max\([\s\S]*?\n\);\n/,
              (match) => `${match}const googleClientId = String(process.env.GOOGLE_CLIENT_ID || "").trim();\nconst googleClientSecret = String(process.env.GOOGLE_CLIENT_SECRET || "").trim();\n`
            );
          }
          if (!server.includes("function sendRedirect(res, location")) {
            server = server.replace(
              'function sendError(res, status, message) {\n  sendJson(res, status, { error: message });\n}\n\n',
              'function sendError(res, status, message) {\n  sendJson(res, status, { error: message });\n}\n\nfunction sendRedirect(res, location, headers = {}) {\n  res.writeHead(302, { location, ...headers });\n  res.end();\n}\n\n'
            );
          }
          if (!server.includes("function appBaseUrl(req)")) {
            server = server.replace("\nasync function routeApi(req, res) {", `\n${decode(helperB64)}\n\nasync function routeApi(req, res) {`);
          }
          if (!server.includes('/api/auth/google/config')) {
            server = server.replace(
              '  if (url.pathname === "/api/health") {\n    return sendJson(res, 200, { ok: true, db: process.env.STUDYBRIDGE_DB || "local" });\n  }\n\n',
              `  if (url.pathname === "/api/health") {\n    return sendJson(res, 200, { ok: true, db: process.env.STUDYBRIDGE_DB || "local" });\n  }\n\n${decode(routesB64)}\n\n`
            );
          }
          fs.writeFileSync("server.js", server, "utf8");

          for (const file of [".env.example"]) {
            if (!fs.existsSync(file)) continue;
            let env = fs.readFileSync(file, "utf8");
            if (!env.includes("APP_BASE_URL=")) {
              env = env.replace("SESSION_SECRET=replace-with-a-long-random-secret\n", "SESSION_SECRET=replace-with-a-long-random-secret\nAPP_BASE_URL=http://localhost:3000\n");
            }
            if (!env.includes("GOOGLE_CLIENT_ID=")) {
              env = env.replace(
                "OWNER_INVITE_CODE=replace-with-a-private-creator-code\n",
                "OWNER_INVITE_CODE=replace-with-a-private-creator-code\n\n# Optional Google sign-in. Keep normal email/password registration enabled too.\n# Set this redirect URI in Google Cloud:\n#   http://localhost:3000/api/auth/google/callback\nGOOGLE_CLIENT_ID=\nGOOGLE_CLIENT_SECRET=\n"
              );
            }
            fs.writeFileSync(file, env, "utf8");
          }
          NODE

          node --check server.js
          node --check public/google-auth-patch.js

      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          git add server.js public/layout-fix.js public/google-auth-patch.js .env.example
          git commit -m "Add Google sign-in support"
          git push
