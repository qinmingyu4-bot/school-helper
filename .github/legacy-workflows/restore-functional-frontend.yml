name: Restore Functional Frontend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/restore-functional-frontend.trigger"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable public frontend
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="46d91b8a20e3fa4472aa7e8b0a7a742285e8c001"
          VERSION="1.0.76"
          git checkout "$BASE" -- public package.json
          if git cat-file -e "$BASE:package-lock.json" 2>/dev/null; then
            git checkout "$BASE" -- package-lock.json
          fi

          cat > public/google-auth-patch.js <<'EOF'
          (() => {
            const authForm = document.querySelector("#authForm");
            const authMessage = document.querySelector("#authMessage");
            const inviteInput = document.querySelector("#inviteInput");
            if (!authForm || document.querySelector("#googleAuthButton")) return;

            const style = document.createElement("style");
            style.textContent = `
              .google-auth-divider {
                display: flex;
                align-items: center;
                gap: 10px;
                color: #64748b;
                font-size: 12px;
                font-weight: 800;
                margin: 2px 0;
              }
              .google-auth-divider::before,
              .google-auth-divider::after {
                content: "";
                height: 1px;
                flex: 1;
                background: #d8dee8;
              }
              .google-auth-button {
                min-height: 42px;
                border: 1px solid #d8dee8;
                border-radius: 8px;
                background: #fff;
                color: #0f1b33;
                font-weight: 900;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                width: 100%;
              }
              .google-auth-button::before {
                content: "G";
                width: 24px;
                height: 24px;
                border-radius: 50%;
                display: inline-grid;
                place-items: center;
                border: 1px solid #d8dee8;
                color: #1a73e8;
                font-weight: 900;
                font-family: Arial, sans-serif;
              }
              .google-auth-button:disabled {
                cursor: not-allowed;
                opacity: 0.62;
              }
              .google-auth-note {
                margin: -4px 0 0;
                color: #64748b;
                font-size: 12px;
                line-height: 1.5;
              }
            `;
            document.head.appendChild(style);

            const divider = document.createElement("div");
            divider.className = "google-auth-divider";
            divider.textContent = "or";

            const button = document.createElement("button");
            button.id = "googleAuthButton";
            button.className = "google-auth-button";
            button.type = "button";
            button.textContent = "使用 Google 登录";

            const note = document.createElement("p");
            note.className = "google-auth-note";
            note.id = "googleAuthNote";
            note.textContent = "第一次用 Google 注册时，也需要输入创作者给的邀请码。";

            const submitButton = document.querySelector("#authSubmit");
            if (!submitButton) return;
            authForm.insertBefore(divider, submitButton);
            authForm.insertBefore(button, submitButton);
            authForm.insertBefore(note, submitButton);

            function activeMode() {
              return document.querySelector("[data-auth-mode].active")?.dataset.authMode === "register" ? "register" : "login";
            }

            function syncButtonText() {
              const mode = activeMode();
              button.textContent = mode === "register" ? "使用 Google 注册" : "使用 Google 登录";
              note.hidden = mode !== "register";
            }

            async function loadConfig() {
              try {
                const response = await fetch("/api/auth/google/config", { credentials: "include" });
                const result = await response.json();
                if (!result.enabled) {
                  button.disabled = true;
                  button.textContent = "Google 登录待配置";
                  note.hidden = false;
                  note.textContent = "配置 Google Client ID 和 Secret 后，这里会自动启用。普通邮箱注册仍可使用。";
                }
              } catch {
                button.disabled = true;
                button.textContent = "Google 登录暂不可用";
                note.hidden = false;
                note.textContent = "普通邮箱注册仍可使用。";
              }
            }

            button.addEventListener("click", () => {
              const mode = activeMode();
              const inviteCode = String(inviteInput?.value || "").trim();
              if (mode === "register" && !inviteCode) {
                if (authMessage) authMessage.textContent = "第一次使用 Google 注册也需要邀请码。";
                inviteInput?.focus();
                return;
              }
              const target = new URL("/api/auth/google/start", window.location.origin);
              target.searchParams.set("mode", mode);
              if (inviteCode) target.searchParams.set("inviteCode", inviteCode);
              window.location.href = target.toString();
            });

            document.querySelectorAll("[data-auth-mode]").forEach((tab) => {
              tab.addEventListener("click", () => setTimeout(syncButtonText, 0));
            });

            const params = new URLSearchParams(window.location.search);
            const authError = params.get("authError");
            if (authError) {
              if (authMessage) authMessage.textContent = authError;
              window.history.replaceState({}, "", window.location.pathname);
            } else if (params.get("googleAuth") === "ok") {
              window.history.replaceState({}, "", window.location.pathname);
              window.location.reload();
            }

            syncButtonText();
            loadConfig();
          })();
          EOF

          node <<'EOF'
          const fs = require('fs');
          const p = 'public/index.html';
          let html = fs.readFileSync(p, 'utf8');
          const tag = '    <script src="/google-auth-patch.js?v=20261008-1.0.76"></script>';
          html = html.replace(/\s*<script src="\/google-auth-patch\.js[^>]*><\/script>/g, '');
          if (html.includes('</body>')) {
            html = html.replace('</body>', `${tag}\n  </body>`);
          } else {
            html += `\n${tag}\n`;
          }
          fs.writeFileSync(p, html);
          EOF

          node -e "const fs=require('fs'); const p='package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.env.VERSION || '1.0.76'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          node -e "const fs=require('fs'); const p='package-lock.json'; if(fs.existsSync(p)){ const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version=process.env.VERSION || '1.0.76'; if(pkg.packages&&pkg.packages['']) pkg.packages[''].version=process.env.VERSION || '1.0.76'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n'); }"
          node --check public/app.js
          for f in public/*.js; do node --check "$f"; done
          git add public package.json package-lock.json 2>/dev/null || git add public package.json
          git commit -m "Restore stable StudyBridge frontend with Google login version 1.0.76 [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 3
          done
          exit 1
