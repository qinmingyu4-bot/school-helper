name: Restore stable frontend 1.1.27

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/restore-stable-trigger.txt

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable frontend files
        run: |
          set -euo pipefail
          cat > /tmp/app.js.gz.b64 <<'B64'

B64
          base64 -d /tmp/app.js.gz.b64 | gzip -dc > public/app.js
          cat > public/index.html <<'HTML'
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge Cloud</title>
    <link rel="stylesheet" href="/style.css?v=1.1.27" />
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="brand-mark">SB</div>
        <strong>StudyBridge</strong>
        <span>Opening StudyBridge...</span>
      </div>
    </div>
    <script src="/app.js?v=1.1.27"></script>
  </body>
</html>
HTML
          node --check public/app.js
      - name: Commit restored frontend
        run: |
          set -euo pipefail
          git config user.name "StudyBridge Restore Bot"
          git config user.email "actions@github.com"
          git add public/app.js public/index.html
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
          else
            git commit -m "Restore stable frontend 1.1.27"
            git push
          fi
