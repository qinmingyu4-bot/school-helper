name: Apply schedule completion hotfix

on:
  push:
    paths:
      - ".github/workflows/schedule-completion-hotfix.yml"
      - "scripts/schedule_completion_hotfix.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch schedule completion support
        run: python3 scripts/schedule_completion_hotfix.py
      - name: Verify syntax
        run: |
          node --check server.js
          node --check lib/database.js
          node --check public/schedule-patch.js
          node --check public/schedule-dashboard-patch.js
          node --check public/schedule-notification-patch.js
      - name: Commit hotfix
        run: |
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js lib/database.js public/schedule-patch.js public/schedule-dashboard-patch.js public/schedule-notification-patch.js
          git commit -m "Add completed state for schedule deadlines"
          git push
