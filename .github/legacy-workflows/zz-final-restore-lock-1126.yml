name: Final restore stable StudyBridge frontend

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/zz-final-restore-lock-1126.yml'

permissions:
  contents: write

env:
  RESTORE_VERSION: "1.1.26"

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore single-controller frontend and lock workflow set
        shell: bash
        run: |
          set -euo pipefail

          echo "== preserve rollback point =="
          git tag -f "rollback-before-stable-${RESTORE_VERSION}" HEAD

          echo "== restore public/app.js from known-good archive =="
          test -f docs/rollback/appjs-1.1.26.gz.b64
          python3 - <<'PY'
          import base64, gzip, json, pathlib, re
          root = pathlib.Path('.')
          payload = root.joinpath('docs/rollback/appjs-1.1.26.gz.b64').read_text(encoding='ascii').strip()
          app = gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          app = re.sub(r'const VERSION = "[^"]+";', 'const VERSION = "1.1.26";', app, count=1)
          required = [
              'function setPage',
              'function routeHtml',
              'communityPage()',
              'classmatesPage()',
              'emailPage()',
              'schedulePage()',
              'toolsPage()',
              'profilePage()',
              'adminPage()'
          ]
          missing = [x for x in required if x not in app]
          if missing:
              raise SystemExit('Restored app.js is missing expected page code: ' + ', '.join(missing))
          root.joinpath('public/app.js').write_text(app, encoding='utf-8', newline='\n')
          pkg_path = root.joinpath('package.json')
          pkg = json.loads(pkg_path.read_text(encoding='utf-8'))
          pkg['version'] = '1.1.26'
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')
          PY

          echo "== restore clean index.html =="
          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>StudyBridge Cloud</title>
              <link rel="stylesheet" href="/style.css?v=1.1.26" />
            </head>
            <body>
              <div id="root">
                <div class="boot-screen">
                  <div class="brand-mark">SB</div>
                  <strong>StudyBridge</strong>
                  <span>Opening StudyBridge...</span>
                </div>
              </div>
              <script src="/app.js?v=1.1.26"></script>
            </body>
          </html>
          HTML

          echo "== disable one-off hotfix workflows so only one frontend controller remains =="
          python3 - <<'PY'
          import pathlib
          keep = {
              'deploy.yml',
              'data-backup-diagnostics.yml',
              'data-backup-runner.yml',
              'zz-final-restore-lock-1126.yml',
          }
          workflows = pathlib.Path('.github/workflows')
          for path in workflows.glob('*.yml'):
              if path.name not in keep:
                  path.unlink()
          PY

          echo "== verify single script entry and syntax =="
          node --check public/app.js
          node --check server.js
          python3 - <<'PY'
          from pathlib import Path
          index = Path('public/index.html').read_text(encoding='utf-8')
          if index.count('<script') != 1 or '/app.js?v=1.1.26' not in index:
              raise SystemExit('index.html must load exactly one app script')
          app = Path('public/app.js').read_text(encoding='utf-8')
          if 'const VERSION = "1.1.26"' not in app:
              raise SystemExit('app.js version mismatch')
          for old in ['student-navigation-hotfix.js', 'rescue-router.js', 'navigation-final-fix.js', 'studybridge-rescue.js']:
              if old in index:
                  raise SystemExit('index still references old patch script: ' + old)
          print('Static restore checks passed')
          PY

      - name: Commit stable restore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          git add public/app.js public/index.html package.json .github/workflows
          if git diff --cached --quiet; then
            echo "No repository changes needed."
          else
            git commit -m "Restore stable StudyBridge frontend 1.1.26"
            git push origin HEAD:main
          fi
          git push -f origin "rollback-before-stable-${RESTORE_VERSION}"
