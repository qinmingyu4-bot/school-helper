name: Restore stable StudyBridge frontend 1.1.27

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/zz-restore-stable-frontend-1127.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable frontend bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, json, pathlib
          payload = """"""
          pathlib.Path('public/app.js').write_bytes(gzip.decompress(base64.b64decode(payload)))
          pathlib.Path('public/index.html').write_text('''<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge Cloud</title>
    <link rel="stylesheet" href="/style.css?v=1.1.27" />
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="brand-mark">SB</div>
        <strong>StudyBridge</strong>
        <span>Opening StudyBridge...</span>
      </div>
    </div>
    <script src="/app.js?v=1.1.27"></script>
  </body>
</html>
''', encoding='utf-8')
          package = {
              'name': 'studybridge-cloud',
              'version': '1.1.27',
              'private': True,
              'description': 'StudyBridge cloud app with login, database-backed student data, and AI backend.',
              'type': 'commonjs',
              'scripts': {'start': 'node server.js', 'dev': 'NODE_ENV=development node server.js'},
              'engines': {'node': '>=20'},
              'dependencies': {'nodemailer': '^6.9.16', 'pdf-parse': '^1.1.1'},
          }
          pathlib.Path('package.json').write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          node --check public/app.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html package.json
          git commit -m "Restore stable StudyBridge frontend v1.1.27" || exit 0
          git push
