name: Apply AI routing patch

on:
  push:
    paths:
      - ".github/workflows/apply-ai-routing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch StudyBridge AI routing
        run: |
          node <<'NODE'
          const fs = require('fs');

          const serverPath = 'server.js';
          let server = fs.readFileSync(serverPath, 'utf8');

          if (!server.includes('const legacyOpenAiModel = String(process.env.OPENAI_MODEL || "").trim();')) {
            server = server.replace(
              'const maxPdfBytes = 8 * 1024 * 1024;\n',
              `const maxPdfBytes = 8 * 1024 * 1024;\nconst legacyOpenAiModel = String(process.env.OPENAI_MODEL || "").trim();\nconst simpleAiModel =\n  String(process.env.OPENAI_SIMPLE_MODEL || process.env.STUDYBRIDGE_SIMPLE_MODEL || "").trim() ||\n  (legacyOpenAiModel && legacyOpenAiModel !== "gpt-4o-mini" ? legacyOpenAiModel : "gpt-6-luna");\nconst complexAiModel =\n  String(process.env.OPENAI_COMPLEX_MODEL || process.env.STUDYBRIDGE_COMPLEX_MODEL || "").trim() ||\n  "gpt-6.1-sol";\n`
            );
          }

          if (!server.includes('function chooseAiModel({ documents = [], history = [], mode = "", message = "" })')) {
            server = server.replace(
              'async function callAi(messages) {',
              `function chooseAiModel({ documents = [], history = [], mode = "", message = "" }) {\n  const lowerMessage = String(message || "").toLowerCase();\n  const totalDocumentText = documents.reduce((total, doc) => total + String(doc.text || "").length, 0);\n  const recentConversationText = history.reduce((total, item) => total + String(item.content || "").length, 0);\n  const complexModes = new Set(["exam", "assignment", "cheatsheet", "cram", "review"]);\n  const complexKeywords = [\n    "final",\n    "midterm",\n    "exam",\n    "quiz",\n    "assignment",\n    "essay",\n    "research paper",\n    "rubric",\n    "deadline",\n    "proof",\n    "derive",\n    "calculus",\n    "statistics",\n    "economics",\n    "accounting",\n    "finance",\n    "programming",\n    "code",\n    "debug",\n    "case study",\n    "lab report",\n    "thesis",\n    "dissertation",\n    "复习",\n    "期末",\n    "期中",\n    "考试",\n    "作业",\n    "论文",\n    "证明",\n    "推导",\n    "代码",\n    "案例",\n    "实验报告",\n    "详细",\n    "深入"\n  ];\n\n  const isComplex =\n    complexModes.has(String(mode || "").toLowerCase()) ||\n    String(message || "").length > 900 ||\n    totalDocumentText > 9000 ||\n    recentConversationText > 7000 ||\n    complexKeywords.some((keyword) => lowerMessage.includes(keyword.toLowerCase()));\n\n  return isComplex ? complexAiModel : simpleAiModel;\n}\n\nasync function callAi(messages, model = simpleAiModel) {`
            );
          }

          server = server.replace('model: process.env.OPENAI_MODEL || "gpt-4o-mini",', 'model,');
          server = server.replace(
            'const aiContent = await callAi(buildStudyPrompt({ user, course, documents, history, mode, message }));',
            'const selectedModel = chooseAiModel({ documents, history, mode, message });\n      console.log(`StudyBridge AI route: ${selectedModel} | mode=${mode} | docs=${documents.length}`);\n      const aiContent = await callAi(buildStudyPrompt({ user, course, documents, history, mode, message }), selectedModel);'
          );
          server = server.replace(
            'return sendJson(res, 201, { messages: [userMessage, assistantMessage] });',
            'return sendJson(res, 201, { messages: [userMessage, assistantMessage], model: selectedModel });'
          );

          fs.writeFileSync(serverPath, server);

          const envPath = '.env.example';
          let env = fs.readFileSync(envPath, 'utf8');
          env = env.replace('OPENAI_MODEL=gpt-4o-mini', 'OPENAI_SIMPLE_MODEL=gpt-6-luna\nOPENAI_COMPLEX_MODEL=gpt-6.1-sol');
          fs.writeFileSync(envPath, env);
          NODE

          node --check server.js

      - name: Commit patched files
        run: |
          if git diff --quiet; then
            echo "No AI routing changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .env.example
          git commit -m "Route complex StudyBridge prompts to stronger model"
          git push
