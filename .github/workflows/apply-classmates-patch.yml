name: Apply classmates server patch

on:
  push:
    paths:
      - ".github/workflows/apply-classmates-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch server.js
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          if 'role: invite.role === "admin" ? "admin" : "student"' not in text:
              text = text.replace(
                  '    label: invite.label || "",\n    maxUses: Number(invite.maxUses || 1),',
                  '    label: invite.label || "",\n    role: invite.role === "admin" ? "admin" : "student",\n    maxUses: Number(invite.maxUses || 1),',
                  1
              )

          helpers = r'''
function classmateConnectionId(userId, peerId) {
  const key = [userId, peerId].sort().join(":");
  return `mate_${crypto.createHash("sha1").update(key).digest("hex").slice(0, 18)}`;
}

function publicClassmate(connection, viewerId, usersById, lastMessage = null) {
  const peerId = (connection.userIds || []).find((id) => id !== viewerId);
  const peer = usersById.get(peerId) || {};
  return {
    id: connection.id,
    createdAt: connection.createdAt,
    updatedAt: connection.updatedAt,
    peer: {
      id: peer.id || peerId || "",
      name: peer.name || "同学",
      email: peer.email || "",
      school: peer.profile?.school || ""
    },
    lastMessage: lastMessage
      ? {
          id: lastMessage.id,
          content: lastMessage.content || "",
          mine: lastMessage.senderId === viewerId,
          createdAt: lastMessage.createdAt
        }
      : null
  };
}

function publicDirectMessage(message, viewerId) {
  return {
    id: message.id,
    content: message.content || "",
    mine: message.senderId === viewerId,
    senderId: message.senderId,
    createdAt: message.createdAt
  };
}
'''
          if 'function classmateConnectionId' not in text:
              marker = '\n\nasync function readJson(req) {'
              if marker not in text:
                  raise SystemExit('Could not find readJson marker')
              text = text.replace(marker, '\n' + helpers + marker, 1)

          routes = r'''
  if (url.pathname === "/api/classmates" && method === "GET") {
    const user = await requireUser(req, res);
    if (!user) return;
    const school = String(user.profile?.school || "").trim();
    const schoolKey = communitySchoolKey(school);
    if (!schoolKey) return sendError(res, 400, "Please fill in your school in Profile first.");
    const [allUsers, connections] = await Promise.all([db.listUsers(), db.listClassmates(user.id)]);
    const usersById = new Map(allUsers.map((item) => [item.id, item]));
    const connectedIds = new Set(
      connections.flatMap((connection) => connection.userIds || []).filter((id) => id && id !== user.id)
    );
    const classmates = await Promise.all(
      connections.map(async (connection) => {
        const messages = await db.listDirectMessages(connection.id, 1);
        return publicClassmate(connection, user.id, usersById, messages[0] || null);
      })
    );
    const candidates = allUsers
      .filter((candidate) => {
        if (candidate.id === user.id || connectedIds.has(candidate.id)) return false;
        return communitySchoolKey(candidate.profile?.school || "") === schoolKey;
      })
      .slice(0, 30)
      .map((candidate) => ({
        id: candidate.id,
        name: candidate.name,
        email: candidate.email,
        school: candidate.profile?.school || ""
      }));
    return sendJson(res, 200, { school, classmates, candidates });
  }

  if (url.pathname === "/api/classmates" && method === "POST") {
    const user = await requireUser(req, res);
    if (!user) return;
    const body = await readJson(req);
    const email = normalizeEmail(body.email);
    if (!email.includes("@")) return sendError(res, 400, "Please enter your classmate's email.");
    const peer = await db.findUserByEmail(email);
    if (!peer) return sendError(res, 404, "No StudyBridge account was found for that email.");
    if (peer.id === user.id) return sendError(res, 400, "You are already in your own workspace.");
    const schoolKey = communitySchoolKey(user.profile?.school || "");
    if (!schoolKey) return sendError(res, 400, "Please fill in your school in Profile first.");
    if (communitySchoolKey(peer.profile?.school || "") !== schoolKey) {
      return sendError(res, 400, "That student is not in the same school yet. Ask them to fill in the same school in Profile.");
    }
    const existing = await db.findClassmateByUsers(user.id, peer.id);
    const connection =
      existing ||
      (await db.createClassmate({
        id: classmateConnectionId(user.id, peer.id),
        userIds: [user.id, peer.id],
        school: user.profile?.school || peer.profile?.school || "",
        schoolKey,
        createdBy: user.id
      }));
    const usersById = new Map([
      [user.id, user],
      [peer.id, peer]
    ]);
    return sendJson(res, existing ? 200 : 201, { classmate: publicClassmate(connection, user.id, usersById) });
  }

  const classmateMessagesMatch = url.pathname.match(/^\/api\/classmates\/([^/]+)\/messages$/);
  if (classmateMessagesMatch && method === "GET") {
    const user = await requireUser(req, res);
    if (!user) return;
    const connection = await db.getClassmate(user.id, classmateMessagesMatch[1]);
    if (!connection) return sendError(res, 404, "Classmate chat not found.");
    const messages = await db.listDirectMessages(connection.id);
    return sendJson(res, 200, { messages: messages.map((message) => publicDirectMessage(message, user.id)) });
  }

  if (classmateMessagesMatch && method === "POST") {
    const user = await requireUser(req, res);
    if (!user) return;
    const connection = await db.getClassmate(user.id, classmateMessagesMatch[1]);
    if (!connection) return sendError(res, 404, "Classmate chat not found.");
    const body = await readJson(req);
    const content = String(body.content || "").trim().slice(0, 1200);
    if (!content) return sendError(res, 400, "Message is required.");
    const recipientId = (connection.userIds || []).find((id) => id !== user.id);
    const message = await db.createDirectMessage({
      id: createId("dm"),
      chatId: connection.id,
      senderId: user.id,
      recipientId,
      content
    });
    return sendJson(res, 201, { message: publicDirectMessage(message, user.id) });
  }

'''
          if 'url.pathname === "/api/classmates"' not in text:
              marker = '  if (url.pathname === "/api/admin/overview" && method === "GET") {'
              if marker not in text:
                  raise SystemExit('Could not find admin overview marker')
              text = text.replace(marker, routes + marker, 1)

          if 'const role = String(body.role || "").toLowerCase()' not in text:
              text = text.replace(
                  '    const maxUses = Math.max(1, Math.min(100, Number(body.maxUses || 1)));\n    const invite = await db.createInvite({',
                  '    const maxUses = Math.max(1, Math.min(100, Number(body.maxUses || 1)));\n    const role = String(body.role || "").toLowerCase() === "admin" || String(body.role || "").toLowerCase() === "co-admin" ? "admin" : "student";\n    const invite = await db.createInvite({',
                  1
              )
              text = text.replace(
                  '      label: String(body.label || "Friend invite").trim().slice(0, 80),\n      maxUses,',
                  '      label: String(body.label || "Friend invite").trim().slice(0, 80),\n      role,\n      maxUses,',
                  1
              )

          path.write_text(text, encoding='utf-8')
          PY
      - name: Check server syntax
        run: node --check server.js
      - name: Commit patched server
        run: |
          if git diff --quiet; then
            echo "No server changes needed."
            exit 0
          fi
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          git add server.js
          git commit -m "Add classmates API"
          git push
