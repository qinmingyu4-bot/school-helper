name: Apply classmate peer profile fields hotfix

on:
  push:
    branches: [main]
    paths:
      - ".github/classmate-peer-fields-trigger.txt"
      - ".github/workflows/classmate-peer-fields-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch server public classmate profile fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('server.js')
          text = path.read_text(encoding='utf-8')
          old = '''          school: peer.profile?.school || "",
          sbId: peer.profile?.sbId || ""'''
          new = '''          school: peer.profile?.school || "",
          major: peer.profile?.major || "",
          avatarUrl: peer.profile?.avatarUrl || "",
          backgroundUrl: peer.profile?.backgroundUrl || "",
          sbId: peer.profile?.sbId || ""'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'avatarUrl: peer.profile?.avatarUrl || ""' not in text:
              raise SystemExit('publicClassmate peer profile block was not found')
          PY
      - name: Verify server syntax
        run: node --check server.js
      - name: Commit hotfix
        run: |
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add server.js
            git commit -m "Expose classmate public profile fields"
            git push
          fi
