name: Classmate Profile Card Hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/friend-request-ui-hotfix-trigger.txt"
      - ".github/workflows/classmate-profile-card-hotfix.yml"
      - "server.js"
      - "public/layout-fix.js"
      - "public/classmate-profile-view.js"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add friend profile card support
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          server_path = Path('server.js')
          server = server_path.read_text(encoding='utf-8')
          if 'avatarUrl: peer.profile?.avatarUrl' not in server:
              old = '''          school: peer.profile?.school || "",
          sbId: peer.profile?.sbId || ""'''
              new = '''          school: peer.profile?.school || "",
          major: peer.profile?.major || "",
          avatarUrl: peer.profile?.avatarUrl || "",
          backgroundUrl: peer.profile?.backgroundUrl || "",
          sbId: peer.profile?.sbId || ""'''
              if old not in server:
                  raise SystemExit('publicClassmate peer block not found')
              server = server.replace(old, new, 1)
              server_path.write_text(server, encoding='utf-8')

          profile_js = r'''(() => {
  let cachedClassmates = [];
  let lastActiveId = "";

  function escapeHtml(value) {
    return String(value == null ? "" : value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function initials(name) {
    const text = String(name || "SB").trim();
    return (text.slice(0, 2) || "SB").toUpperCase();
  }

  function installStyle() {
    if (document.querySelector("#studybridge-peer-profile-style")) return;
    const style = document.createElement("style");
    style.id = "studybridge-peer-profile-style";
    style.textContent = `
      .classmates-chat-shell {
        grid-template-rows: auto auto minmax(0, 1fr) auto !important;
      }

      .peer-profile-card {
        margin: 14px 18px 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        overflow: hidden;
      }

      .peer-profile-card[hidden] { display: none !important; }

      .peer-profile-cover {
        position: relative;
        height: 92px;
        background: linear-gradient(145deg, #1f3a5f, #67a989);
      }

      .peer-profile-cover > img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .peer-profile-avatar {
        position: absolute;
        left: 16px;
        bottom: -24px;
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border: 3px solid white;
        border-radius: 10px;
        background: linear-gradient(145deg, #1f3a5f, #2f7d62);
        color: white;
        font-weight: 900;
        overflow: hidden;
        box-shadow: 0 10px 24px rgba(25, 36, 58, 0.12);
      }

      .peer-profile-avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .peer-profile-body {
        display: grid;
        gap: 7px;
        padding: 32px 16px 14px;
      }

      .peer-profile-name {
        color: var(--navy);
        font-size: 18px;
        line-height: 1.2;
      }

      .peer-profile-facts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .peer-profile-facts span {
        padding: 4px 7px;
        border-radius: 999px;
        background: #f3f6fb;
      }
    `;
    document.head.appendChild(style);
  }

  function ensureCard() {
    const shell = document.querySelector("#classmatesPage .classmates-chat-shell");
    if (!shell) return null;
    let card = shell.querySelector("#peerProfileCard");
    if (card) return card;
    const head = shell.querySelector(".classmates-chat-head");
    const list = shell.querySelector("#directMessageList");
    if (!head || !list) return null;
    card = document.createElement("article");
    card.id = "peerProfileCard";
    card.className = "peer-profile-card";
    card.hidden = true;
    head.insertAdjacentElement("afterend", card);
    return card;
  }

  function activeClassmateId() {
    const active = document.querySelector("#classmatesPage .classmate-row.active [data-open-classmate]");
    return active ? active.dataset.openClassmate || "" : "";
  }

  async function fetchClassmates() {
    const response = await fetch("/api/classmates", { cache: "no-store" });
    if (!response.ok) return cachedClassmates;
    const payload = await response.json().catch(() => ({}));
    cachedClassmates = payload.classmates || [];
    return cachedClassmates;
  }

  function renderPeer(card, peer) {
    if (!peer) {
      card.hidden = true;
      card.innerHTML = "";
      return;
    }
    const cover = peer.backgroundUrl ? '<img src="' + escapeHtml(peer.backgroundUrl) + '" alt="" />' : "";
    const avatar = peer.avatarUrl
      ? '<img src="' + escapeHtml(peer.avatarUrl) + '" alt="' + escapeHtml(peer.name || "classmate") + '" />'
      : '<span>' + escapeHtml(initials(peer.name)) + '</span>';
    const facts = [];
    if (peer.school) facts.push('<span><strong>\u5b66\u6821\uff1a</strong>' + escapeHtml(peer.school) + '</span>');
    if (peer.major) facts.push('<span><strong>\u4e13\u4e1a\uff1a</strong>' + escapeHtml(peer.major) + '</span>');
    if (peer.sbId) facts.push('<span><strong>SB ID\uff1a</strong>@' + escapeHtml(peer.sbId) + '</span>');
    if (!facts.length) facts.push('<span>\u8fd8\u6ca1\u6709\u586b\u5199\u516c\u5f00\u8d44\u6599</span>');
    card.hidden = false;
    card.innerHTML =
      '<div class="peer-profile-cover">' + cover + '<div class="peer-profile-avatar">' + avatar + '</div></div>' +
      '<div class="peer-profile-body"><strong class="peer-profile-name">' + escapeHtml(peer.name || "\u540c\u5b66") + '</strong>' +
      '<div class="peer-profile-facts">' + facts.join("") + '</div></div>';
  }

  async function syncPeerProfile() {
    installStyle();
    const page = document.querySelector("#classmatesPage");
    const card = ensureCard();
    if (!page || page.hidden || !card) return;
    const id = activeClassmateId();
    if (!id) {
      renderPeer(card, null);
      return;
    }
    if (id !== lastActiveId || !cachedClassmates.length) {
      lastActiveId = id;
      await fetchClassmates();
    }
    const match = cachedClassmates.find((item) => item.id === id);
    renderPeer(card, match ? match.peer : null);
  }

  document.addEventListener("click", () => setTimeout(syncPeerProfile, 120), true);
  setInterval(syncPeerProfile, 2500);
  syncPeerProfile();
})();
'''
          Path('public/classmate-profile-view.js').write_text(profile_js, encoding='utf-8')

          layout_path = Path('public/layout-fix.js')
          layout = layout_path.read_text(encoding='utf-8')
          if 'classmate-profile-view.js' not in layout:
              layout, count = re.subn(
                  r'(  loadScriptOnce\("/classmates-request-patch\.js\?v=20261005-\d+"\);\n)',
                  r'\1  loadScriptOnce("/classmate-profile-view.js?v=20261005-1");\n',
                  layout,
                  count=1
              )
              if count != 1:
                  raise SystemExit('classmates script anchor not found')
              layout_path.write_text(layout, encoding='utf-8')
          PY

      - name: Check JavaScript
        run: |
          node --check server.js
          node --check public/layout-fix.js
          node --check public/classmate-profile-view.js

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No classmate profile card changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/layout-fix.js public/classmate-profile-view.js
          git commit -m "Add classmate profile card"
          git push
