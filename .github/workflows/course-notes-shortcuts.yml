name: Check classroom keyboard shortcuts
on:
  pull_request:
    paths:
      - '.github/workflows/course-notes-shortcuts.yml'
      - 'scripts/desktop-notes-preview.cjs'
      - 'public/course-notes.js'
      - 'public/course-notes-model.js'
      - 'public/course-notes.css'
      - 'tests/browser/course-notes-shortcuts.cjs'
permissions:
  contents: read
jobs:
  shortcuts:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the browser test driver
        shell: bash
        run: npm install --prefix "$RUNNER_TEMP/notes-test" --no-save --ignore-scripts playwright@1.62.1
      - name: Exercise shortcuts in installed Chrome
        env:
          NOTES_SCREENSHOT_DIR: ${{ runner.temp }}/notes-viewports
          NOTES_PLAYWRIGHT_MODULE: ${{ runner.temp }}/notes-test/node_modules/playwright
        run: node tests/browser/course-notes-shortcuts.cjs
      - name: Save viewport screenshots
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: notes-viewports
          path: ${{ runner.temp }}/notes-viewports/
          retention-days: 3

      - name: Return requested screenshot proof
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          python3 - <<'PYDATA'
          import base64, os
          from pathlib import Path
          for file in sorted((Path(os.environ['RUNNER_TEMP'])/'notes-viewports').glob('*.png')):
              encoded = base64.b64encode(file.read_bytes()).decode('ascii')
              for i in range(0,len(encoded),4000):
                  print(f'PROOF {file.stem} {i} {encoded[i:i+4000]}')
          PYDATA
