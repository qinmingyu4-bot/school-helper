name: Deploy StudyBridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studybridge-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: bash -n scripts/deploy-release.sh
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
          SMTP_CONFIG_JSON: ${{ secrets.SMTP_CONFIG_JSON }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -z "${LIGHTSAIL_SSH_KEY_B64:-}" ]; then
            echo "LIGHTSAIL_SSH_KEY_B64 is missing. Add the base64 one-line private key as a repository secret."
            exit 1
          fi
          printf '%s' "$LIGHTSAIL_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d | tr -d '\r' > ~/.ssh/studybridge_deploy_key
          printf '\n' >> ~/.ssh/studybridge_deploy_key
          chmod 600 ~/.ssh/studybridge_deploy_key
          trap 'rm -f ~/.ssh/studybridge_deploy_key' EXIT
          if ! ssh-keygen -y -f ~/.ssh/studybridge_deploy_key > /dev/null; then
            echo "LIGHTSAIL_SSH_KEY_B64 must contain the base64-encoded complete, unencrypted SSH private key."
            exit 1
          fi
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/studybridge_deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" bash -s -- "$GITHUB_SHA" <<'EOF'
            set -euo pipefail
            cd ~/school-helper
            git fetch origin main
            if [ "$(git rev-parse origin/main)" != "$1" ]; then
              echo "A newer main commit superseded this deployment."
              exit 0
            fi
            git show "$1:scripts/deploy-release.sh" | bash -s -- "$1" "$PWD"
          EOF
          if [[ -n "${GOOGLE_CLIENT_ID:-}" && -n "${GOOGLE_CLIENT_SECRET:-}" ]]; then
            python3 - <<'PY' | ssh -i ~/.ssh/studybridge_deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" "cd ~/school-helper && python3 aws/configure-google-login.py '$GITHUB_SHA'"
          import json, os, sys
          json.dump({key: os.environ[key] for key in ('GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET')}, sys.stdout)
          PY
          fi
          if [[ -n "${SMTP_CONFIG_JSON:-}" ]]; then
            python3 - <<'PYSMTP' | ssh -i ~/.ssh/studybridge_deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" "cd ~/school-helper && python3 aws/configure-smtp-email.py '$GITHUB_SHA'"
          import json, os, sys
          json.dump(json.loads(os.environ['SMTP_CONFIG_JSON']), sys.stdout)
          PYSMTP
          fi
