name: Deploy StudyBridge

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: studybridge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/studybridge_deploy_key
          chmod 600 ~/.ssh/studybridge_deploy_key
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/studybridge_deploy_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST" <<'EOF'
            set -e
            cd ~/school-helper
            git pull --ff-only origin main
            npm install --omit=dev
            pm2 restart studybridge --update-env
            pm2 save
          EOF
