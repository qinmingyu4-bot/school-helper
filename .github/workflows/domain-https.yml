name: Configure StudyBridge domain HTTPS

on:
  push:
    branches: [codex/studybridge-domain-https]
    paths: [.github/workflows/domain-https.yml, aws/domain-https.sh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studybridge-production
  cancel-in-progress: false

jobs:
  https:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate domain setup script
        run: bash -n aws/domain-https.sh
      - name: Prepare domain and configure trusted HTTPS after DNS propagation
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          trap 'rm -f ~/.ssh/studybridge_domain_key' EXIT
          printf '%s' "$LIGHTSAIL_SSH_KEY_B64" | tr -d '[:space:]' | base64 -d | tr -d '\r' > ~/.ssh/studybridge_domain_key
          printf '\n' >> ~/.ssh/studybridge_domain_key
          chmod 600 ~/.ssh/studybridge_domain_key
          ssh-keygen -y -f ~/.ssh/studybridge_domain_key >/dev/null
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          SSH=(ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o ConnectTimeout=20 -i ~/.ssh/studybridge_domain_key "$LIGHTSAIL_USER@$LIGHTSAIL_HOST")
          "${SSH[@]}" 'sudo -n bash -s -- inspect' < aws/domain-https.sh
          "${SSH[@]}" 'sudo -n bash -s -- prepare' < aws/domain-https.sh
          for attempt in $(seq 1 60); do
            if "${SSH[@]}" 'sudo -n bash -s -- apply' < aws/domain-https.sh; then
              exit 0
            else
              result=$?
              if [[ $result != 75 ]]; then exit "$result"; fi
            fi
            echo "Public DNS pending ($attempt/60); retrying in 30 seconds."
            sleep 30
          done
          echo 'Public DNS did not propagate within 30 minutes. HTTP preparation is retained; rerun after propagation.' >&2
          exit 75
