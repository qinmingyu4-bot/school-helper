name: Friend Request Server Hotfix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    env:
      GET_BLOCK_B64: >-
        
      POST_BLOCK_B64: >-
        
    steps:
      - uses: actions/checkout@v4
      - name: Patch server.js
        run: |
          python - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('server.js')
          source = path.read_text(encoding='utf-8')
          if 'const classmateRequestMatch = url.pathname.match' in source and 'requests });' in source:
              print('already patched')
              raise SystemExit(0)
          get_block = base64.b64decode(os.environ['GET_BLOCK_B64']).decode('utf-8')
          post_block = base64.b64decode(os.environ['POST_BLOCK_B64']).decode('utf-8')
          start = source.index('  if (url.pathname === "/api/classmates" && method === "GET") {')
          post = source.index('if (url.pathname === "/api/classmates" && method === "POST") {', start)
          end = source.index('const directMessageMatch = url.pathname.match', post)
          path.write_text(source[:start] + get_block + post_block + source[end:], encoding='utf-8')
          print('server.js patched')
          PY
      - name: Check syntax
        run: node --check server.js
      - name: Commit server.js
        run: |
          if git diff --quiet -- server.js; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix classmate friend request inbox"
          git push
