name: Apply StudyBridge friend request server hotfix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch friend request backend
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          old_get_users = '''  const users = await db.listUsers();
  const candidates = users
'''
          new_get_users = '''  const pendingRequests = (await db.listClassmateRequests(user.id)).filter((item) => (item.status || "pending") === "pending");
  const requestPeerIds = new Set(
    pendingRequests
      .flatMap((item) => [item.fromUserId, item.toUserId])
      .filter((id) => id && id !== user.id)
  );
  const requestPeers = await Promise.all([...requestPeerIds].map((id) => db.getUser(id)));
  const requestPeerById = new Map(requestPeers.filter(Boolean).map((peer) => [peer.id, peer]));
  const publicRequestPeer = (peer) => ({
    id: peer?.id || "",
    name: peer?.name || "同学",
    email: peer?.email || "",
    school: peer?.profile?.school || "",
    major: peer?.profile?.major || "",
    sbId: peer?.profile?.sbId || ""
  });
  const requests = {
    incoming: pendingRequests
      .filter((item) => item.toUserId === user.id)
      .map((item) => ({
        id: item.id,
        status: item.status || "pending",
        createdAt: item.createdAt,
        from: publicRequestPeer(requestPeerById.get(item.fromUserId))
      })),
    outgoing: pendingRequests
      .filter((item) => item.fromUserId === user.id)
      .map((item) => ({
        id: item.id,
        status: item.status || "pending",
        createdAt: item.createdAt,
        to: publicRequestPeer(requestPeerById.get(item.toUserId))
      }))
  };
  const users = await db.listUsers();
  const candidates = users
'''
          if new_get_users not in text:
              if old_get_users not in text:
                  raise SystemExit('Could not find classmate GET users anchor')
              text = text.replace(old_get_users, new_get_users, 1)

          old_candidate_filter = '''    .filter((candidate) => !connectedIds.has(candidate.id))
    .filter((candidate) => !school || String(candidate.profile?.school || "").trim().toLowerCase() === school.toLowerCase())
'''
          new_candidate_filter = '''    .filter((candidate) => !connectedIds.has(candidate.id))
    .filter((candidate) => !requestPeerIds.has(candidate.id))
    .filter((candidate) => !school || String(candidate.profile?.school || "").trim().toLowerCase() === school.toLowerCase())
'''
          if new_candidate_filter not in text:
              if old_candidate_filter not in text:
                  raise SystemExit('Could not find candidate filter anchor')
              text = text.replace(old_candidate_filter, new_candidate_filter, 1)

          old_candidate_major = '''      school: candidate.profile?.school || "",
      sbId: candidate.profile?.sbId || ""
'''
          new_candidate_major = '''      school: candidate.profile?.school || "",
      major: candidate.profile?.major || "",
      sbId: candidate.profile?.sbId || ""
'''
          if new_candidate_major not in text:
              if old_candidate_major not in text:
                  raise SystemExit('Could not find candidate map anchor')
              text = text.replace(old_candidate_major, new_candidate_major, 1)

          old_get_return = '''  return sendJson(res, 200, { classmates, candidates, school });
}

if (url.pathname === "/api/classmates" && method === "POST") {
'''
          new_get_return = '''  return sendJson(res, 200, { classmates, candidates, school, requests });
}

if (url.pathname === "/api/classmates" && method === "POST") {
'''
          if new_get_return not in text:
              if old_get_return not in text:
                  raise SystemExit('Could not find classmate GET return anchor')
              text = text.replace(old_get_return, new_get_return, 1)

          old_post_tail = '''  const existing = await db.findClassmateByUsers(user.id, peer.id);
  const connection = existing || await db.createClassmate({ id: createId("mate"), userIds: [user.id, peer.id] });
  return sendJson(res, existing ? 200 : 201, { classmate: await publicClassmate(connection, user.id) });
}

const directMessageMatch = url.pathname.match(/^\\/api\\/classmates\\/([^/]+)\\/messages$/);
'''
          new_post_tail = '''  const existing = await db.findClassmateByUsers(user.id, peer.id);
  if (existing) {
    return sendJson(res, 200, { status: "connected", classmate: await publicClassmate(existing, user.id) });
  }

  const incomingRequest = await db.findClassmateRequestByUsers(peer.id, user.id);
  if (incomingRequest) {
    const accepted = await db.updateClassmateRequest(incomingRequest.id, {
      status: "accepted",
      respondedAt: new Date().toISOString()
    });
    const connection = await db.createClassmate({ id: createId("mate"), userIds: [user.id, peer.id], requestId: incomingRequest.id });
    return sendJson(res, 201, { status: "connected", request: accepted, classmate: await publicClassmate(connection, user.id) });
  }

  const existingRequest = await db.findClassmateRequestByUsers(user.id, peer.id);
  const request = existingRequest || await db.createClassmateRequest({
    id: createId("mateReq"),
    fromUserId: user.id,
    toUserId: peer.id
  });
  return sendJson(res, existingRequest ? 200 : 201, {
    status: "pending",
    request: {
      id: request.id,
      status: request.status || "pending",
      createdAt: request.createdAt
    }
  });
}

const classmateRequestMatch = url.pathname.match(/^\\/api\\/classmate-requests\\/([^/]+)$/);
if (classmateRequestMatch && method === "PATCH") {
  const user = await requireUser(req, res);
  if (!user) return;
  const body = await readJson(req);
  const action = String(body.action || "").toLowerCase();
  if (action !== "accept" && action !== "ignore") return sendError(res, 400, "Please choose accept or ignore.");
  const request = await db.getClassmateRequest(user.id, classmateRequestMatch[1]);
  if (!request || (request.status || "pending") !== "pending") return sendError(res, 404, "Friend request not found.");
  if (request.toUserId !== user.id) return sendError(res, 403, "Only the receiver can respond to this request.");

  if (action === "ignore") {
    const ignored = await db.updateClassmateRequest(request.id, { status: "ignored", respondedAt: new Date().toISOString() });
    return sendJson(res, 200, { status: "ignored", request: ignored });
  }

  const existing = await db.findClassmateByUsers(request.fromUserId, request.toUserId);
  const connection = existing || await db.createClassmate({
    id: createId("mate"),
    userIds: [request.fromUserId, request.toUserId],
    requestId: request.id
  });
  const accepted = await db.updateClassmateRequest(request.id, { status: "accepted", respondedAt: new Date().toISOString() });
  return sendJson(res, 200, { status: "connected", request: accepted, classmate: await publicClassmate(connection, user.id) });
}

const directMessageMatch = url.pathname.match(/^\\/api\\/classmates\\/([^/]+)\\/messages$/);
'''
          if 'const classmateRequestMatch = url.pathname.match(/^\\/api\\/classmate-requests' not in text:
              if old_post_tail not in text:
                  raise SystemExit('Could not find classmate POST tail anchor')
              text = text.replace(old_post_tail, new_post_tail, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Validate server syntax
        run: node --check server.js
      - name: Commit hotfix
        run: |
          if git diff --quiet -- server.js; then
            echo "server.js already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix StudyBridge classmate friend requests"
          git push
