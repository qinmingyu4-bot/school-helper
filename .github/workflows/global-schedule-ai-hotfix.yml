name: Apply global schedule AI context hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/global-schedule-ai-hotfix.yml"

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add global schedule context to AI prompt
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("server.js")
          text = path.read_text(encoding="utf-8")

          if "function parseScheduleDocument(doc, course = {})" not in text:
              marker = "function buildStudyPrompt({ user, course, documents, history, mode, message }) {"
              insert = '''const scheduleItemPrefix = "[SCHEDULE_ITEM]";

function parseScheduleDocument(doc, course = {}) {
  if (!String(doc.title || "").startsWith(scheduleItemPrefix) && String(doc.type || "") !== "Schedule") return null;
  try {
    const data = JSON.parse(doc.text || "{}");
    if (!data.title || !data.startsAt) return null;
    return {
      id: doc.id,
      title: String(data.title || "").slice(0, 160),
      kind: String(data.kind || "deadline").slice(0, 40),
      course: String(data.course || course.name || "").slice(0, 100),
      startsAt: data.startsAt,
      location: String(data.location || "").slice(0, 160),
      notes: String(data.notes || "").slice(0, 600),
      completedAt: data.completedAt || ""
    };
  } catch {
    return null;
  }
}

async function listUserScheduleItems(userId) {
  const courses = await db.listCourses(userId);
  const perCourse = await Promise.all(
    courses.map(async (course) => ({
      course,
      documents: await db.listDocuments(userId, course.id)
    }))
  );
  return perCourse
    .flatMap(({ course, documents }) => documents.map((doc) => parseScheduleDocument(doc, course)).filter(Boolean))
    .filter((item) => !item.completedAt)
    .sort((a, b) => new Date(a.startsAt).getTime() - new Date(b.startsAt).getTime());
}

function formatScheduleContext(scheduleItems = []) {
  const upcoming = scheduleItems.filter((item) => Number.isFinite(new Date(item.startsAt).getTime())).slice(0, 20);
  if (!upcoming.length) {
    return "No unfinished schedule/deadline items are saved for this student.";
  }
  return upcoming
    .map((item, index) => {
      const bits = [
        `${index + 1}. ${item.title}`,
        `course=${item.course || "unknown"}`,
        `kind=${item.kind || "deadline"}`,
        `due=${item.startsAt}`
      ];
      if (item.location) bits.push(`location=${item.location}`);
      if (item.notes) bits.push(`notes=${item.notes}`);
      return bits.join(" | ");
    })
    .join("\\n");
}

function buildStudyPrompt({ user, course, documents, history, scheduleItems, mode, message }) {'''
              if marker not in text:
                  raise SystemExit("buildStudyPrompt marker not found")
              text = text.replace(marker, insert, 1)
          else:
              text = text.replace("function buildStudyPrompt({ user, course, documents, history, mode, message }) {", "function buildStudyPrompt({ user, course, documents, history, scheduleItems, mode, message }) {")

          old_system = '"You are StudyBridge, a bilingual academic coach for international students. Explain in Chinese, preserve key English academic terms, help students learn without doing prohibited final submissions for them, and keep answers grounded in the provided course material. When the student has provided a school, tailor examples, terminology, planning advice, and campus context to that school when useful."'
          new_system = '"You are StudyBridge, a bilingual academic coach for international students. Explain in Chinese, preserve key English academic terms, help students learn without doing prohibited final submissions for them, and keep answers grounded in the provided course material and the student\'s global schedule. When the student asks about due dates, unfinished work, deadlines, exams, or what to do next, always use the global unfinished schedule/deadline context, even if the current chat is inside a different course."'
          if old_system in text:
              text = text.replace(old_system, new_system, 1)

          old_content = '''      )}\\n\\nCourse material:\\n${docContext || "No course material saved yet."}\\n\\nRecent chat:\\n${recent || "No prior messages."}\\n\\nStudent question:\\n${message}`'''
          new_content = '''      )}\\nCurrent server time: ${new Date().toISOString()}\\n\\nGlobal unfinished schedule/deadline items across this student's account:\\n${formatScheduleContext(scheduleItems)}\\n\\nCourse material for the current chat course:\\n${docContext || "No course material saved yet."}\\n\\nRecent chat in the current course:\\n${recent || "No prior messages."}\\n\\nStudent question:\\n${message}`'''
          if old_content in text:
              text = text.replace(old_content, new_content, 1)

          old_fetch = "const [documents, history] = await Promise.all([db.listDocuments(user.id, courseId), db.listMessages(user.id, courseId)]);"
          new_fetch = '''const [documents, history, scheduleItems] = await Promise.all([
        db.listDocuments(user.id, courseId),
        db.listMessages(user.id, courseId),
        listUserScheduleItems(user.id)
      ]);'''
          if old_fetch in text:
              text = text.replace(old_fetch, new_fetch, 1)

          old_log = "console.log(`StudyBridge AI route: ${selectedModel} | mode=${mode} | docs=${documents.length}`);"
          new_log = "console.log(`StudyBridge AI route: ${selectedModel} | mode=${mode} | docs=${documents.length} | schedule=${scheduleItems.length}`);"
          if old_log in text:
              text = text.replace(old_log, new_log, 1)

          old_call = "const aiContent = await callAi(buildStudyPrompt({ user, course, documents, history, mode, message }), selectedModel);"
          new_call = "const aiContent = await callAi(buildStudyPrompt({ user, course, documents, history, scheduleItems, mode, message }), selectedModel);"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate backend syntax
        run: node --check server.js
      - name: Commit schedule AI context fix
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Add global schedule context to AI"
          git push
