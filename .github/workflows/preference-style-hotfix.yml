name: Apply StudyBridge Learning Style Hotfix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/preference-style-hotfix.yml
      - .github/preference-style-hotfix-trigger.txt

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server prompt
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text(encoding='utf-8')

          if 'function buildPreferenceInstruction(' not in text:
              text = text.replace(
                  'function buildStudyPrompt({ user, course, documents, history, scheduleItems, weatherContext, mode, message }) {\n  const docContext = documents',
                  'function buildStudyPrompt({ user, course, documents, history, scheduleItems, weatherContext, mode, message }) {\n  const preferenceInstruction = buildPreferenceInstruction(user.preferences || {});\n  const docContext = documents',
                  1,
              )

              text = text.replace(
                  'When real-time weather context is provided, answer the weather question directly and include practical clothing/commute advice." +\n        buildCheatSheetInstruction(mode, message)',
                  'When real-time weather context is provided, answer the weather question directly and include practical clothing/commute advice." +\n        preferenceInstruction +\n        buildCheatSheetInstruction(mode, message)',
                  1,
              )

              text = text.replace(
                  'Course: ${course.name}\\nMode: ${mode}\\nPreferences: ${JSON.stringify(\n        user.preferences || {}\n      )}\\nCurrent server time:',
                  'Course: ${course.name}\\nMode: ${mode}\\nLearning style instructions:\\n${preferenceInstruction || "Use StudyBridge defaults: Chinese explanation with helpful English academic terms."}\\nRaw preferences: ${JSON.stringify(\n        user.preferences || {}\n      )}\\nCurrent server time:',
                  1,
              )

              helper = '''
function buildPreferenceInstruction(preferences = {}) {
  const englishTerms = preferences.englishTerms !== false;
  const englishAnswers = preferences.englishAnswers !== false;
  const chineseExplanations = preferences.chineseExplanations !== false;
  const customInstruction = String(preferences.customInstruction || "").trim();
  const lines = [
    "\\n\\nFollow the student's Learning Style exactly unless it conflicts with safety or the user's latest message."
  ];

  if (englishTerms) {
    lines.push("- Keep important academic keywords, formulas, course concepts, due-date labels, and technical terms in English. Add concise Chinese explanation after them when helpful.");
  } else {
    lines.push("- Translate English academic terms into Chinese when natural, but keep proper nouns, formulas, and exact course labels unchanged.");
  }

  if (englishAnswers && chineseExplanations) {
    lines.push("- For problem-solving, assignments, emails, practice questions, or exam prep: give the direct English answer/draft first, then explain the reasoning and steps in Chinese.");
  } else if (englishAnswers) {
    lines.push("- For problem-solving, assignments, emails, practice questions, or exam prep: give the direct English answer/draft first, then keep the rest concise.");
  } else if (chineseExplanations) {
    lines.push("- Explain reasoning, steps, and study strategy in Chinese first. Include English only where it improves academic accuracy.");
  } else {
    lines.push("- Keep answers concise and match the user's language.");
  }

  lines.push("- These Learning Style options do not conflict: English terms are vocabulary anchors, English answer is the final/draft output, and Chinese reasoning is the explanation layer.");

  if (customInstruction) {
    lines.push(`- Student custom instruction: ${customInstruction}`);
  }

  return lines.join("\\n");
}

'''
              text = text.replace('function chooseAiModel({ documents = [], history = [], mode = "", message = "" }) {', helper + 'function chooseAiModel({ documents = [], history = [], mode = "", message = "" }) {', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Check syntax
        run: node --check server.js

      - name: Commit hotfix
        run: |
          if git diff --quiet -- server.js; then
            echo "Learning Style backend hotfix already applied."
            exit 0
          fi
          git config user.name "StudyBridge bot"
          git config user.email "actions@github.com"
          git add server.js
          git commit -m "Apply Learning Style backend prompt rules"
          git push
