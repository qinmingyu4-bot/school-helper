name: Apply StudyBridge profile, SB ID, and classmates hotfix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch backend and UI safely
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          function read(file) {
            return fs.readFileSync(file, 'utf8');
          }

          function write(file, text) {
            fs.writeFileSync(file, text);
          }

          function replaceRegex(file, regex, replacement, label) {
            const text = read(file);
            if (!regex.test(text)) {
              console.log(`Skip ${label}: already patched or target changed.`);
              return;
            }
            write(file, text.replace(regex, replacement));
            console.log(`Patched ${label}`);
          }

          function replaceLiteral(file, from, to, label) {
            const text = read(file);
            if (!text.includes(from)) {
              console.log(`Skip ${label}: already patched or target changed.`);
              return;
            }
            write(file, text.replace(from, to));
            console.log(`Patched ${label}`);
          }

          function insertBefore(file, marker, insert, unique, label) {
            const text = read(file);
            if (text.includes(unique)) {
              console.log(`Skip ${label}: already patched.`);
              return;
            }
            if (!text.includes(marker)) throw new Error(`Missing marker for ${label}`);
            write(file, text.replace(marker, `${insert}\n${marker}`));
            console.log(`Inserted ${label}`);
          }

          let server = read('server.js');
          if (!server.includes('function isValidSbId(value)')) {
            server = server.replace(
              /function cleanProfile\(body = \{\}\) \{[\s\S]*?\n\}\n\nfunction decodeBase64Data/,
              `function cleanProfile(body = {}) {
            const sbId = String(body.sbId || "")
              .trim()
              .toLowerCase()
              .replace(/^@+/, "")
              .slice(0, 24);
            return {
              avatarUrl: String(body.avatarUrl || "").trim().slice(0, 2200000),
              backgroundUrl: String(body.backgroundUrl || "").trim().slice(0, 2200000),
              school: String(body.school || "").trim().slice(0, 120),
              major: String(body.major || "").trim().slice(0, 120),
              sbId
            };
          }

          function isValidSbId(value) {
            const sbId = String(value || "").trim();
            return !sbId || /^[a-z0-9][a-z0-9._-]{2,23}$/.test(sbId);
          }

          function decodeBase64Data`
            );
            write('server.js', server);
            console.log('Patched cleanProfile and SB ID validator');
          }

          replaceLiteral('server.js',
          `      profile: {
                avatarUrl: "",
                backgroundUrl: "",
                school: ""
              },`,
          `      profile: {
                avatarUrl: "",
                backgroundUrl: "",
                school: "",
                major: "",
                sbId: ""
              },`,
          'registration profile defaults');

          replaceLiteral('server.js',
          `content: \`Student: \${user.name}\\nSchool: \${user.profile?.school || "Not provided"}\\nCourse: \${course.name}\\nMode: \${mode}\\nPreferences: \${JSON.stringify(`,
          `content: \`Student: \${user.name}\\nSchool: \${user.profile?.school || "Not provided"}\\nMajor: \${user.profile?.major || "Not provided"}\\nCourse: \${course.name}\\nMode: \${mode}\\nPreferences: \${JSON.stringify(`,
          'major in AI prompt');

          replaceLiteral('server.js',
          `    const profile = cleanProfile(body);
            const updated = await db.updateUser(user.id, { name, profile });`,
          `    const profile = cleanProfile(body);
            if (!isValidSbId(profile.sbId)) {
              return sendError(res, 400, "SB ID must be 3-24 characters and can use letters, numbers, dots, underscores, or dashes.");
            }
            if (profile.sbId) {
              const existingSbUser = await db.findUserBySbId(profile.sbId);
              if (existingSbUser && existingSbUser.id !== user.id) {
                return sendError(res, 409, "This SB ID is already taken.");
              }
            }
            const updated = await db.updateUser(user.id, { name, profile });`,
          'profile save validation');

          const classmateHelpers = `async function publicClassmate(connection, viewerId) {
            const peerId = (connection.userIds || []).find((id) => id !== viewerId);
            const peer = peerId ? await db.getUser(peerId) : null;
            const messages = await db.listDirectMessages(connection.id, 1);
            const last = messages[messages.length - 1] || null;
            return {
              id: connection.id,
              peer: peer
                ? {
                    id: peer.id,
                    name: peer.name || "同学",
                    email: peer.email || "",
                    school: peer.profile?.school || "",
                    sbId: peer.profile?.sbId || ""
                  }
                : null,
              lastMessage: last
                ? {
                    content: last.content || "",
                    createdAt: last.createdAt,
                    mine: last.senderId === viewerId
                  }
                : null,
              updatedAt: connection.updatedAt || connection.createdAt
            };
          }
          `;
          insertBefore('server.js', 'async function readJson(req) {', classmateHelpers, 'async function publicClassmate', 'classmate public helper');

          const classmateRoutes = `  if (url.pathname === "/api/classmates" && method === "GET") {
            const user = await requireUser(req, res);
            if (!user) return;
            const connections = await db.listClassmates(user.id);
            const classmates = await Promise.all(connections.map((item) => publicClassmate(item, user.id)));
            const connectedIds = new Set(connections.flatMap((item) => item.userIds || []));
            const school = String(user.profile?.school || "").trim();
            const users = await db.listUsers();
            const candidates = users
              .filter((candidate) => candidate.id !== user.id)
              .filter((candidate) => !connectedIds.has(candidate.id))
              .filter((candidate) => !school || String(candidate.profile?.school || "").trim().toLowerCase() === school.toLowerCase())
              .slice(0, 30)
              .map((candidate) => ({
                id: candidate.id,
                name: candidate.name,
                email: candidate.email,
                school: candidate.profile?.school || "",
                sbId: candidate.profile?.sbId || ""
              }));
            return sendJson(res, 200, { classmates, candidates, school });
          }

          if (url.pathname === "/api/classmates" && method === "POST") {
            const user = await requireUser(req, res);
            if (!user) return;
            const body = await readJson(req);
            const sbId = String(body.sbId || body.studentId || "")
              .trim()
              .toLowerCase()
              .replace(/^@+/, "");
            const email = normalizeEmail(body.email);
            if (sbId && !isValidSbId(sbId)) return sendError(res, 400, "Please enter a valid SB ID.");
            if (!sbId && !email.includes("@")) return sendError(res, 400, "Please enter your classmate's SB ID.");
            const peer = sbId ? await db.findUserBySbId(sbId) : await db.findUserByEmail(email);
            if (!peer) return sendError(res, 404, sbId ? "No StudyBridge account was found for that SB ID." : "No StudyBridge account was found for that email.");
            if (peer.id === user.id) return sendError(res, 400, "You cannot add yourself.");
            const existing = await db.findClassmateByUsers(user.id, peer.id);
            const connection = existing || await db.createClassmate({ id: createId("mate"), userIds: [user.id, peer.id] });
            return sendJson(res, existing ? 200 : 201, { classmate: await publicClassmate(connection, user.id) });
          }

          const directMessageMatch = url.pathname.match(/^\\/api\\/classmates\\/([^/]+)\\/messages$/);
          if (directMessageMatch && method === "GET") {
            const user = await requireUser(req, res);
            if (!user) return;
            const connection = await db.getClassmate(user.id, directMessageMatch[1]);
            if (!connection) return sendError(res, 404, "Classmate chat not found.");
            const messages = await db.listDirectMessages(connection.id);
            return sendJson(res, 200, {
              messages: messages.map((message) => ({
                id: message.id,
                content: message.content,
                createdAt: message.createdAt,
                senderId: message.senderId,
                mine: message.senderId === user.id
              }))
            });
          }

          if (directMessageMatch && method === "POST") {
            const user = await requireUser(req, res);
            if (!user) return;
            const connection = await db.getClassmate(user.id, directMessageMatch[1]);
            if (!connection) return sendError(res, 404, "Classmate chat not found.");
            const body = await readJson(req);
            const content = String(body.content || "").trim().slice(0, 1200);
            if (!content) return sendError(res, 400, "Message is required.");
            const message = await db.createDirectMessage({ id: createId("dm"), chatId: connection.id, senderId: user.id, content });
            return sendJson(res, 201, { message: { ...message, mine: true } });
          }
          `;
          insertBefore('server.js', '  if (url.pathname === "/api/courses" && method === "GET") {', classmateRoutes, 'url.pathname === "/api/classmates"', 'classmate routes');

          const dbFile = 'lib/database.js';
          let dbText = read(dbFile);
          if (!dbText.includes('async findUserBySbId')) {
            dbText = dbText.replace(
              '  async getUser(userId) {',
              `  async findUserBySbId(sbId) {
            const normalized = String(sbId || "").trim().toLowerCase();
            if (!normalized) return null;
            if (this.dynamo) {
              const users = await this.listUsers();
              return users.find((user) => String(user.profile?.sbId || "").trim().toLowerCase() === normalized) || null;
            }
            return this.local.read((db) =>
              Object.values(db.users || {}).find((user) => String(user.profile?.sbId || "").trim().toLowerCase() === normalized) || null
            );
          }

          async getUser(userId) {`
            );
            write(dbFile, dbText);
            console.log('Inserted findUserBySbId');
          }

          replaceLiteral('public/app.js',
          `        name: profileNameInput.value,
                school: schoolInput.value,
                avatarUrl: avatarUrlInput.value,`,
          `        name: profileNameInput.value,
                school: schoolInput.value,
                major: document.querySelector("#majorInput")?.value || "",
                sbId: document.querySelector("#sbIdInput")?.value || "",
                avatarUrl: avatarUrlInput.value,`,
          'profile submit payload');

          replaceLiteral('public/app.js',
          `  profileNameInput.value = state.user?.name || "";
          schoolInput.value = profile.school || "";
          avatarUrlInput.value = profile.avatarUrl || "";`,
          `  profileNameInput.value = state.user?.name || "";
          schoolInput.value = profile.school || "";
          const majorInput = document.querySelector("#majorInput");
          const sbIdInput = document.querySelector("#sbIdInput");
          if (majorInput) majorInput.value = profile.major || "";
          if (sbIdInput) sbIdInput.value = profile.sbId || "";
          avatarUrlInput.value = profile.avatarUrl || "";`,
          'profile form values');

          replaceLiteral('public/classmates-patch.js', '<input id="classmateEmailInput" type="email" placeholder="输入同学注册邮箱" />', '<input id="classmateEmailInput" type="text" placeholder="输入同学的 SB ID，例如 adam2026" autocomplete="off" />', 'classmate input label');
          replaceLiteral('public/classmates-patch.js', '"可以通过注册邮箱添加同学。"', '"可以通过同学的 SB ID 添加。"', 'classmate status text');
          replaceLiteral('public/classmates-patch.js', '输入同学注册邮箱开始。', '输入同学的 SB ID 开始。', 'classmate empty text');
          replaceLiteral('public/classmates-patch.js', '也可以输入邮箱添加。', '也可以输入 SB ID 添加。', 'classmate candidate text');
          replaceLiteral('public/classmates-patch.js', '${escapeHtml(item.peer?.email || "")}${escapeHtml(last).slice(0, 70)}', '${escapeHtml(item.peer?.sbId ? `@${item.peer.sbId}` : item.peer?.email || "")}${escapeHtml(last).slice(0, 70)}', 'classmate peer sbid display');
          replaceLiteral('public/classmates-patch.js', '${escapeHtml(item.email)}</span>', '${escapeHtml(item.sbId ? `@${item.sbId}` : item.email)}</span>', 'candidate sbid display');
          replaceLiteral('public/classmates-patch.js', 'data-add-candidate="${escapeHtml(item.email)}"', 'data-add-candidate="${escapeHtml(item.sbId || item.email)}"', 'candidate sbid action');
          replaceLiteral('public/classmates-patch.js',
          `    const email = input.value.trim();
          if (!email) return;
          status.textContent = "正在添加同学...";
          try {
            const result = await api("/api/classmates", { method: "POST", body: { email } });`,
          `    const sbId = input.value.trim().replace(/^@+/, "");
          if (!sbId) return;
          status.textContent = "正在添加同学...";
          try {
            const result = await api("/api/classmates", { method: "POST", body: { sbId } });`,
          'classmate submit sbid');
          NODE

          node --check server.js
          node --check lib/database.js
          node --check public/app.js
          node --check public/classmates-patch.js
          node --check public/profile-fields-patch.js

      - name: Commit hotfix
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No hotfix changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js lib/database.js public/app.js public/classmates-patch.js public/profile-fields-patch.js
          git commit -m "Persist profile major and add SB ID classmates"
          git push
