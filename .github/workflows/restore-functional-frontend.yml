name: Restore Functional Frontend

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/restore-functional-frontend.trigger"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore stable public frontend
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BASE="46d91b8a20e3fa4472aa7e8b0a7a742285e8c001"
          git checkout "$BASE" -- public package.json
          if git cat-file -e "$BASE:package-lock.json" 2>/dev/null; then
            git checkout "$BASE" -- package-lock.json
          fi
          node -e "const fs=require('fs'); const p='package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='1.0.75'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n');"
          node -e "const fs=require('fs'); const p='package-lock.json'; if(fs.existsSync(p)){ const pkg=JSON.parse(fs.readFileSync(p,'utf8')); pkg.version='1.0.75'; if(pkg.packages&&pkg.packages['']) pkg.packages[''].version='1.0.75'; fs.writeFileSync(p, JSON.stringify(pkg,null,2)+'\n'); }"
          node --check public/app.js
          for f in public/*.js; do node --check "$f"; done
          git add public package.json package-lock.json 2>/dev/null || git add public package.json
          git commit -m "Restore stable StudyBridge frontend version 1.0.75 [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 3
          done
          exit 1
