name: Restore StudyBridge Stable Frontend

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/restore-stable-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable frontend files
        run: |
          python3 - <<'PY'
          import base64, gzip, json, pathlib
          b64 = (
          ""
          )
          app = gzip.decompress(base64.b64decode(b64))
          pathlib.Path("public").mkdir(exist_ok=True)
          pathlib.Path("public/app.js").write_bytes(app)
          pathlib.Path("public/index.html").write_text("""<!doctype html>
<html lang=\"zh-CN\">
  <head>
    <meta charset=\"UTF-8\" />
    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />
    <title>StudyBridge Cloud</title>
    <link rel=\"stylesheet\" href=\"/style.css?v=1.1.27\" />
  </head>
  <body>
    <div id=\"root\">
      <div class=\"boot-screen\">
        <div class=\"brand-mark\">SB</div>
        <strong>StudyBridge</strong>
        <span>Opening StudyBridge...</span>
      </div>
    </div>
    <script src=\"/app.js?v=1.1.27\"></script>
  </body>
</html>
""", encoding="utf-8")
          pkg_path = pathlib.Path("package.json")
          pkg = json.loads(pkg_path.read_text(encoding="utf-8"))
          pkg["version"] = "1.1.27"
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          node --check public/app.js
          python3 - <<'PY'
          import hashlib, pathlib
          digest = hashlib.sha256(pathlib.Path('public/app.js').read_bytes()).hexdigest().upper()
          print('app.js sha256', digest)
          assert digest == '41329B5AF177DBBC579A47B3E4181DC0D3B5ED5726EE6624D2E2B03A1ACE8C88'
          PY
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          git add public/app.js public/index.html package.json
          git commit -m "Restore StudyBridge stable frontend bundle" || exit 0
          git push
