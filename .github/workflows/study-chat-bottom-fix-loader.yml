name: Load study chat bottom overlap fix

on:
  push:
    paths:
      - ".github/workflows/study-chat-bottom-fix-loader.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch layout loader
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path("public/layout-fix.js")
          text = path.read_text(encoding="utf-8")
          line = '  loadScriptOnce("/study-chat-bottom-fix.js?v=20261006-1");'
          if line not in text:
              anchor = '  loadScriptOnce("/chat-bubble-compact-live.js?v=20261005-1");'
              if anchor not in text:
                  raise SystemExit("loader anchor not found")
              text = text.replace(anchor, anchor + "\n" + line, 1)
              path.write_text(text, encoding="utf-8")
          PY
          node --check public/layout-fix.js
          node --check public/study-chat-bottom-fix.js
          if git diff --quiet -- public/layout-fix.js; then
            echo "loader already updated"
          else
            git config user.name "qinmingyu4-bot"
            git config user.email "qinmingyu4-bot@users.noreply.github.com"
            git add public/layout-fix.js
            git commit -m "Load study chat bottom overlap fix"
            git push
          fi
