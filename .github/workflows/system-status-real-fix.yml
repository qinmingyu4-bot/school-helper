'''
          if 'url.pathname === "/api/admin/system-status"' not in server:
              server = server.replace(route_anchor, route_block + route_anchor, 1)
          else:
              server = re.sub(
                  r'database:\s*\{\s*mode:\s*db\.mode \|\| process\.env\.STUDYBRIDGE_DB \|\| "local"\s*\}',
                  'database: databaseStatus()',
                  server,
                  count=1,
              )
          server_path.write_text(server, encoding="utf-8")
          PY
          node --check public/layout-fix.js
          node --check public/system-status-patch.js
          node --check server.js
      - name: Commit patched files
        run: |
          git config user.name "qinmingyu4-bot"
          git config user.email "qinmingyu4-bot@users.noreply.github.com"
          git add public/layout-fix.js public/system-status-patch.js server.js
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Repair system diagnostics and creator spacing"
            git push
          fi
