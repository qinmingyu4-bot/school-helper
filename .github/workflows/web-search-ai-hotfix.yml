name: Apply StudyBridge web-search AI route

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server AI route
        run: |
          cat > /tmp/apply-web-ai-route.js <<'NODE'
          const fs = require("fs");
          const path = "server.js";
          let text = fs.readFileSync(path, "utf8");

          text = text.replace(
            /const webSearchModel =\n  String\(process\.env\.OPENAI_WEB_MODEL \|\| process\.env\.STUDYBRIDGE_WEB_MODEL \|\| ""\)\.trim\(\) \|\|\n  simpleAiModel;/,
            'const webSearchModel =\n  String(process.env.OPENAI_WEB_MODEL || process.env.STUDYBRIDGE_WEB_MODEL || "").trim() ||\n  complexAiModel ||\n  simpleAiModel;'
          );

          text = text.replace(
            'return "Weather lookup failed: " + ((error && error.message) || "unknown error") + ". Tell the student the live weather service is temporarily unavailable.";',
            'return "Weather lookup failed: " + ((error && error.message) || "unknown error") + ". If web search is available, use it to answer the weather question instead of stopping. If no live lookup is available, tell the student the weather service is temporarily unavailable.";'
          );

          text = text.replace(
            'Answer any user question that is allowed by OpenAI safety rules. Explain in Chinese by default, preserve key English academic terms, and help students learn without doing prohibited final submissions for them.',
            'Answer any user question that is allowed by OpenAI safety rules; do not refuse just because the question is not about school. Explain in Chinese by default, preserve key English academic terms, and help students learn without doing prohibited final submissions for them.'
          );
          text = text.replace(
            'For general knowledge or current-information questions where the local StudyBridge data is missing, use reliable general knowledge and, when web search is available, use web search for fresh facts.',
            'For general knowledge, current-information questions, weather, news, product prices, policies, rankings, or any question where local StudyBridge data is missing, use reliable general knowledge and, when web search is available, use web search for fresh facts instead of claiming you cannot browse.'
          );

          text = text.replace(
            'async function callAiWithResponses(messages, model) {',
            'async function callAiWithResponses(messages, model, toolType = "web_search") {'
          );
          text = text.replace(
            'type: "web_search",\n          search_context_size: "medium"',
            'type: toolType,\n          search_context_size: "medium"'
          );

          if (!text.includes('web_search_preview')) {
            text = text.replace(
              `    } catch (error) {\n      console.warn("StudyBridge web AI route failed, falling back to chat completions: " + (error?.message || error));\n    }`,
              `    } catch (error) {\n      const message = String((error && error.message) || error);\n      if (message.includes("web_search")) {\n        try {\n          return await callAiWithResponses(messages, webSearchModel || model, "web_search_preview");\n        } catch (previewError) {\n          console.warn("StudyBridge preview web route failed, falling back to chat completions: " + ((previewError && previewError.message) || previewError));\n        }\n      } else {\n        console.warn("StudyBridge web AI route failed, falling back to chat completions: " + message);\n      }\n    }`
            );
          }

          fs.writeFileSync(path, text, "utf8");
          NODE
          node /tmp/apply-web-ai-route.js
          node --check server.js
      - name: Commit hotfix
        run: |
          if git diff --quiet -- server.js; then
            echo "No server AI changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Improve StudyBridge AI web answers"
          git push
