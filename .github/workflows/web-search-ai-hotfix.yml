name: Apply StudyBridge web-search AI route

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server AI route and learning style
        run: |
          cat > /tmp/apply-ai-route-and-style.js <<'NODE'
          const fs = require("fs");
          const path = "server.js";
          let text = fs.readFileSync(path, "utf8");

          text = text.replace(
            /const webSearchModel =\n  String\(process\.env\.OPENAI_WEB_MODEL \|\| process\.env\.STUDYBRIDGE_WEB_MODEL \|\| ""\)\.trim\(\) \|\|\n  simpleAiModel;/,
            'const webSearchModel =\n  String(process.env.OPENAI_WEB_MODEL || process.env.STUDYBRIDGE_WEB_MODEL || "").trim() ||\n  complexAiModel ||\n  simpleAiModel;'
          );

          text = text.replace(
            'return "Weather lookup failed: " + ((error && error.message) || "unknown error") + ". Tell the student the live weather service is temporarily unavailable.";',
            'return "Weather lookup failed: " + ((error && error.message) || "unknown error") + ". If web search is available, use it to answer the weather question instead of stopping. If no live lookup is available, tell the student the weather service is temporarily unavailable.";'
          );

          text = text.replace(
            'Answer any user question that is allowed by OpenAI safety rules. Explain in Chinese by default, preserve key English academic terms, and help students learn without doing prohibited final submissions for them.',
            'Answer any user question that is allowed by OpenAI safety rules; do not refuse just because the question is not about school. Explain in Chinese by default, preserve key English academic terms, and help students learn without doing prohibited final submissions for them.'
          );
          text = text.replace(
            'For general knowledge or current-information questions where the local StudyBridge data is missing, use reliable general knowledge and, when web search is available, use web search for fresh facts.',
            'For general knowledge, current-information questions, weather, news, product prices, policies, rankings, or any question where local StudyBridge data is missing, use reliable general knowledge and, when web search is available, use web search for fresh facts instead of claiming you cannot browse.'
          );

          text = text.replace(
            'async function callAiWithResponses(messages, model) {',
            'async function callAiWithResponses(messages, model, toolType = "web_search") {'
          );
          text = text.replace(
            'type: "web_search",\n          search_context_size: "medium"',
            'type: toolType,\n          search_context_size: "medium"'
          );

          if (!text.includes('web_search_preview')) {
            text = text.replace(
              `    } catch (error) {\n      console.warn("StudyBridge web AI route failed, falling back to chat completions: " + (error?.message || error));\n    }`,
              `    } catch (error) {\n      const message = String((error && error.message) || error);\n      if (message.includes("web_search")) {\n        try {\n          return await callAiWithResponses(messages, webSearchModel || model, "web_search_preview");\n        } catch (previewError) {\n          console.warn("StudyBridge preview web route failed, falling back to chat completions: " + ((previewError && previewError.message) || previewError));\n        }\n      } else {\n        console.warn("StudyBridge web AI route failed, falling back to chat completions: " + message);\n      }\n    }`
            );
          }

          const promptStart = 'function buildStudyPrompt({ user, course, documents, history, scheduleItems, weatherContext, mode, message }) {\n';
          if (text.includes(promptStart) && !text.includes('const preferenceInstruction = buildPreferenceInstruction(user.preferences || {});')) {
            text = text.replace(
              promptStart + '  const docContext = documents',
              promptStart + '  const preferenceInstruction = buildPreferenceInstruction(user.preferences || {});\n  const docContext = documents'
            );
          }
          text = text.replace(
            'When real-time weather context is provided, answer the weather question directly and include practical clothing/commute advice." +\n        buildCheatSheetInstruction(mode, message)',
            'When real-time weather context is provided, answer the weather question directly and include practical clothing/commute advice." +\n        preferenceInstruction +\n        buildCheatSheetInstruction(mode, message)'
          );
          text = text.replace(
            'Course: ${course.name}\\nMode: ${mode}\\nPreferences: ${JSON.stringify(\n        user.preferences || {}\n      )}\\nCurrent server time:',
            'Course: ${course.name}\\nMode: ${mode}\\nLearning style instructions:\\n${preferenceInstruction || "Use StudyBridge defaults: Chinese explanation with helpful English academic terms."}\\nRaw preferences: ${JSON.stringify(\n        user.preferences || {}\n      )}\\nCurrent server time:'
          );

          const helper = `function buildPreferenceInstruction(preferences = {}) {
  const englishTerms = preferences.englishTerms !== false;
  const englishAnswers = preferences.englishAnswers !== false;
  const chineseExplanations = preferences.chineseExplanations !== false;
  const customInstruction = String(preferences.customInstruction || "").trim();
  const lines = [
    "\\n\\nLearning Style is mandatory. It overrides the general default language style unless it conflicts with safety or the user's latest message."
  ];

  if (englishTerms) {
    lines.push("- English terms ON: keep important academic keywords, formulas, course concepts, due-date labels, assignment wording, and technical terms in English. Add concise Chinese explanation after them when helpful.");
  } else {
    lines.push("- English terms OFF: translate English academic terms into Chinese when natural, but keep proper nouns, formulas, and exact course labels unchanged.");
  }

  if (englishAnswers && chineseExplanations) {
    lines.push("- English answer ON + Chinese reasoning ON: for problem-solving, assignments, emails, practice questions, exam prep, or study planning, use this order exactly: first provide the direct answer/draft in English, then provide the reasoning, steps, study plan, and warnings in Chinese.");
  } else if (englishAnswers) {
    lines.push("- English answer ON: provide the direct answer/draft in English first, then keep the rest concise.");
  } else if (chineseExplanations) {
    lines.push("- Chinese reasoning ON: explain reasoning, steps, and study strategy in Chinese first. Include English only where it improves academic accuracy.");
  } else {
    lines.push("- Keep answers concise and match the user's language.");
  }

  lines.push("- These three default options do not conflict: English terms are vocabulary anchors, English answer is the final/draft output layer, and Chinese reasoning is the explanation layer.");
  lines.push("- Do not ignore these settings. If the answer is not a question-solving task, still preserve English terms when enabled and use Chinese for explanation when enabled.");

  if (customInstruction) {
    lines.push("- Student custom instruction: " + customInstruction);
  }

  return lines.join("\\n");
}

`;

          if (text.includes('function buildPreferenceInstruction(preferences = {}) {')) {
            const start = text.indexOf('function buildPreferenceInstruction(preferences = {}) {');
            const end = text.indexOf('function chooseAiModel(', start);
            if (end === -1) throw new Error('Could not locate chooseAiModel after buildPreferenceInstruction.');
            text = text.slice(0, start) + helper + text.slice(end);
          } else {
            text = text.replace('function chooseAiModel(', helper + 'function chooseAiModel(');
          }

          fs.writeFileSync(path, text, "utf8");
          NODE
          node /tmp/apply-ai-route-and-style.js
          node --check server.js
      - name: Commit hotfix
        run: |
          if git diff --quiet -- server.js; then
            echo "No server AI changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Enforce Learning Style in AI replies"
          git push
