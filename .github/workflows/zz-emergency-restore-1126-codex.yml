name: Emergency Restore StudyBridge 1.1.26

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/zz-emergency-restore-1126-codex.yml
      - docs/rollback/appjs-1.1.26.gz.b64

permissions:
  contents: write

concurrency:
  group: studybridge-emergency-restore-1126
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Restore stable frontend bundle
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BACKUP_TAG="rollback-before-restore-1126-$(date -u +%Y%m%d%H%M%S)"
          git tag "$BACKUP_TAG" || true

          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip
          payload = Path('docs/rollback/appjs-1.1.26.gz.b64').read_text(encoding='ascii').strip()
          data = gzip.decompress(base64.b64decode(payload))
          text = data.decode('utf-8')
          if 'const VERSION = "1.1.26"' not in text:
              raise SystemExit('rollback bundle is not StudyBridge 1.1.26')
          Path('public/app.js').write_text(text, encoding='utf-8')
          PY

          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>StudyBridge Cloud</title>
              <link rel="stylesheet" href="/style.css?v=1.1.26" />
            </head>
            <body>
              <div id="root">
                <div class="boot-screen">
                  <div class="brand-mark">SB</div>
                  <strong>StudyBridge</strong>
                  <span>Opening StudyBridge...</span>
                </div>
              </div>
              <script src="/app.js?v=1.1.26"></script>
            </body>
          </html>
          HTML

          python3 - <<'PY'
          from pathlib import Path
          import json
          p = json.loads(Path('package.json').read_text(encoding='utf-8'))
          p['version'] = '1.1.26'
          Path('package.json').write_text(json.dumps(p, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

          node --check public/app.js
          node --check server.js
          grep 'VERSION = "1.1.26"' public/app.js
          grep 'app.js?v=1.1.26' public/index.html

          git add public/index.html public/app.js package.json docs/rollback/appjs-1.1.26.gz.b64
          if git diff --cached --quiet; then
            echo "No changes needed. Stable frontend is already restored."
          else
            git commit -m "Restore stable StudyBridge frontend 1.1.26"
            git tag -f rollback-studybridge-1.1.26-codex
            git push origin HEAD:main
            git push origin "$BACKUP_TAG" || true
            git push origin rollback-studybridge-1.1.26-codex --force || true
          fi
