name: Final Restore Lock 1.1.26

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/final-restore-lock-trigger.txt

permissions:
  contents: write

concurrency:
  group: studybridge-final-restore-lock
  cancel-in-progress: false

jobs:
  restore-lock-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for older patch workflows
        run: sleep 75

      - name: Restore stable frontend and disable legacy patch workflows
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BACKUP_TAG="rollback-before-final-restore-$(date -u +%Y%m%d%H%M%S)"
          git tag "$BACKUP_TAG" || true

          mkdir -p public .github/workflows
          base64 -d docs/rollback/appjs-1.1.26.gz.b64 | gzip -d > public/app.js

          cat > public/index.html <<'HTML'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>StudyBridge Cloud</title>
              <link rel="stylesheet" href="/style.css?v=1.1.26" />
            </head>
            <body>
              <div id="root">
                <div class="boot-screen">
                  <div class="brand-mark">SB</div>
                  <strong>StudyBridge</strong>
                  <span>Opening StudyBridge...</span>
                </div>
              </div>
              <script src="/app.js?v=1.1.26"></script>
            </body>
          </html>
          HTML

          for f in .github/workflows/*.yml; do
            b="$(basename "$f")"
            case "$b" in
              deploy.yml|data-backup-runner.yml|zz-final-restore-lock-1126.yml)
                continue
                ;;
            esac
            cat > "$f" <<YAML
          name: Disabled legacy patch - $b

          on:
            workflow_dispatch:

          jobs:
            disabled:
              runs-on: ubuntu-24.04
              steps:
                - run: echo "Disabled because it was an old one-time patch workflow that could overwrite the restored frontend."
          YAML
          done

          node --check public/app.js
          node --check server.js

          git add public/index.html public/app.js .github/workflows
          if git diff --cached --quiet; then
            echo "No repository changes needed."
          else
            git commit -m "Restore stable StudyBridge frontend 1.1.26 and disable legacy patch workflows"
            git push origin HEAD:main
            git push origin "$BACKUP_TAG" || true
          fi

      - name: Deploy to Lightsail
        env:
          LIGHTSAIL_HOST: ${{ secrets.LIGHTSAIL_HOST }}
          LIGHTSAIL_USER: ${{ secrets.LIGHTSAIL_USER }}
          LIGHTSAIL_SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          LIGHTSAIL_SSH_KEY_B64: ${{ secrets.LIGHTSAIL_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          if [ -n "${LIGHTSAIL_SSH_KEY_B64:-}" ]; then
            printf '%s' "$LIGHTSAIL_SSH_KEY_B64" | base64 -d > ~/.ssh/studybridge_deploy_key
          else
            printf '%s\n' "$LIGHTSAIL_SSH_KEY" > ~/.ssh/studybridge_deploy_key
          fi
          chmod 600 ~/.ssh/studybridge_deploy_key
          ssh-keyscan -H "$LIGHTSAIL_HOST" >> ~/.ssh/known_hosts
          USER_NAME="${LIGHTSAIL_USER:-ubuntu}"
          ssh -i ~/.ssh/studybridge_deploy_key "$USER_NAME@$LIGHTSAIL_HOST" <<'EOSSH'
          set -euo pipefail
          cd ~/school-helper
          git fetch origin main
          git reset --hard origin/main
          npm install --omit=dev
          pm2 restart studybridge --update-env
          pm2 save
          node --check public/app.js
          grep 'VERSION = "1.1.26"' public/app.js
          EOSSH
