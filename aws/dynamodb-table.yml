AWSTemplateFormatVersion: "2010-09-09"
Description: StudyBridge DynamoDB table for users, sessions, courses, documents, and chat messages.

Parameters:
  TableName:
    Type: String
    Default: StudyBridge

Resources:
  StudyBridgeTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

Outputs:
  TableName:
    Value: !Ref StudyBridgeTable
  TableArn:
    Value: !GetAtt StudyBridgeTable.Arn
