<script>function createScrollTrial() {
  const get = id => document.getElementById(id);
  const variants = {180:'A',90:'B'};
  const counts = {A:{runs:0,handoffs:0},B:{runs:0,handoffs:0}};
  const marks = [];
  let recent = [], pending, round=0, pause=180;
  const mode = () => variants[pause];
  const observed = () => {
    const viewer=document.querySelector('.note-scroll');
    return {paper:Math.round(viewer?.scrollTop || 0),page:Math.round(document.scrollingElement.scrollTop)};
  };
  function note(kind, gap, paper, page, newHandoff) {
    if (newHandoff) counts[mode()].handoffs++;
    const item=recent.at(-1);
    if (item && item.kind===kind && gap!==null && gap<pause) {
      item.events++;
      item.maxGap=Math.max(item.maxGap,gap);
      return;
    }
    recent.push({kind,gap,events:1,maxGap:0,paper:Math.round(paper),page:Math.round(page)});
    if (recent.length>8) recent.shift();
  }
  function restart() {
    pause=Number(get('variant').value);
    round++;
    recent=[];
    counts[mode()].runs++;
  }
  function capture(){
    const state=observed();
    return {mode:mode(),pause,round,...state,trace:recent.map(entry=>({...entry}))};
  }
  function describe(snapshot) {
    const last=snapshot.trace.at(-1);
    return snapshot.mode+' 版 · '+(last?last.kind:'本轮还没有纸面滚动记录')+'。纸面距顶 '+snapshot.paper+' px，外层距顶 '+snapshot.page+' px。';
  }
  function report(){
    const lines=['StudyBridge 课堂笔记 · 滚动体验反馈 v2',
      '设备：'+get('device').value+'；整体偏好：'+get('preference').value,
      'A（180 ms）和 B（90 ms）按连续两次向上滚动事件的间隔判断停顿。'];
    for(const k of ['A','B'])lines.push(k+'：开始 '+counts[k].runs+' 轮，带动外层 '+counts[k].handoffs+' 次');
    function trace(s){
      return s.trace.map(t=>t.kind+' [纸 '+t.paper+' / 页 '+t.page+' px，间隔 '+(t.gap===null?'起始':t.gap+' ms')+(t.events>1?'，连续 '+t.events+' 个事件，最大间隔 '+t.maxGap+' ms':'')+']').join(' → ');
    }
    marks.forEach((m,i)=>{lines.push((i+1)+'. 第 '+m.round+' 轮，'+describe(m)+' 感受：'+m.reason+(m.detail?'。'+m.detail:''));
      if(m.trace.length)lines.push('   '+trace(m));});
    if(!marks.length)lines.push('未标记具体问题。');
    const latest=capture();
    if(latest.trace.length)lines.push('最后一轮：'+describe(latest),trace(latest));
    if(get('comment').value.trim())lines.push('补充：'+get('comment').value.trim());
    return lines.join('\n');
  }
  get('variant').onchange=()=>get('restart').click();
  get('flag').onclick=()=>{
    pending=capture();
    get('snapshot').textContent=describe(pending);
    get('detail').value='';
    get('issue').returnValue='cancel';
    get('issue').showModal();
  };
  get('issue').addEventListener('close',()=>{
    if(get('issue').returnValue==='keep' && pending){
      marks.push({...pending,reason:get('reason').value,detail:get('detail').value.trim()});
      get('review').textContent='整理反馈（'+marks.length+'）';
    }
    pending=null;
  });
  function refresh(){get('report').value=report();get('copy-state').textContent='';}
  get('review').onclick=()=>{refresh();get('summary').showModal();};
  for(const id of ['device','preference','comment'])get(id).addEventListener('input',refresh);
  get('copy').onclick=async()=>{
    refresh();
    try{await navigator.clipboard.writeText(get('report').value);get('copy-state').textContent='已复制，可以粘贴回聊天。';}
    catch{
      get('report').closest('details').open=true;
      get('report').focus();get('report').select();
      get('copy-state').textContent='已选中反馈，按 ⌘C 或 Ctrl+C 复制，或保存为 TXT。';
    }
  };
  get('download').onclick=()=>{
    const url=URL.createObjectURL(new Blob(['\uFEFF'+report()],{type:'text/plain;charset=utf-8'}));
    const link=document.createElement('a');link.href=url;link.download='StudyBridge_Scroll_Feedback.txt';
    document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
    get('copy-state').textContent='请把下载的 TXT 发回聊天。';
  };
  return {restart,note,get pause(){return pause;},get round(){return round;}};
}
const trial=createScrollTrial();

          ? `<div role="listbox" aria-label="${t('课程','Course')}">${options}</div><button type="button" class="note-add-course" data-note="add-course"><span>${t('添加课程','Add course')}</span><span aria-hidden="true">＋</span></button>`
          : options;
      }
    }
  }
  function openPicker(key, focus=false) {
    closePickers(); syncPickers();
    const trigger=$(`[data-picker-toggle="${key}"]`), menu=$(`#note-${key}-menu`);
    if (trigger.disabled) return;
    menu.hidden=false; trigger.setAttribute('aria-expanded','true');
    if (focus) (menu.querySelector('[aria-selected="true"]') || menu.querySelector('button'))?.focus();
  }
  document.addEventListener('click',event=>{if(host && !event.target.closest('.note-field'))closePickers();});
  function build() {
    host=document.createElement('section'); host.className='course-notes';
    const icons={
      sticky:'<path d="M4 3h16v12l-5 6H4V3Zm11 18v-6h5M8 8h8M8 12h5"/>',
      hand:'<path d="M8 13V6a2 2 0 0 1 4 0v6-8a2 2 0 0 1 4 0v8-6a2 2 0 0 1 4 0v9c0 4-2.5 6-6 6h-1c-2 0-3.5-1-5-3l-4-5a2 2 0 0 1 3-2l1 1"/>',
      pen:'<path d="m15 5 4 4M4 20l5-1L20 8a2.8 2.8 0 0 0-4-4L5 15l-1 5Z"/>',
      highlight:'<path d="m13 4 7 7-7 7-7-7 7-7ZM6 11l-2 5 4 4 5-2M4 16l-2 5h6M14 7l3 3"/>',
      text:'<path d="M5 7V4h14v3M12 4v16M8 20h8"/>',
      eraser:'<path d="m15 3 6 6a1.5 1.5 0 0 1 0 2l-9 9H7l-5-5a1.5 1.5 0 0 1 0-2L13 3a1.5 1.5 0 0 1 2 0ZM7 8l9 9M12 20h9"/>',
      undo:'<path d="m8 4-5 5 5 5M3 9h11a6 6 0 0 1 0 12h-3"/>',
      redo:'<path d="m16 4 5 5-5 5M21 9H10a6 6 0 0 0 0 12h3"/>'
    };
    const icon=id=>`<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${icons[id]}</svg>`;
    const button=(id,zh,en)=>`<button type="button" data-note="${id}"${icons[id]?` class="note-icon-button" aria-label="${t(zh,en)}" title="${t(zh,en)}"`:''}>${icons[id]?icon(id):t(zh,en)}</button>`;
    host.innerHTML=`<div class="note-picker"><div class="note-location">${picker('course',t('课程','Course'),t('选择课程','Choose a course'))}<span class="note-location-divider" aria-hidden="true">/</span>${picker('document',t('笔记与课件','Notes and PDFs'),documentPlaceholder())}</div><div class="note-picker-actions">${button('new-blank','新建空白笔记','New blank note')}<label class="note-upload"><span aria-hidden="true">＋</span>${t('上传 PDF','Upload PDF')}<input data-upload type="file" accept="application/pdf,.pdf"></label>${button('study','在学习区查看','View in Study')}</div></div>
    <p role="status" aria-live="polite"></p><div class="note-work" hidden><div class="note-toolbar" role="toolbar" aria-label="${t('笔记工具','Note tools')}">${[['hand','浏览','Browse'],['pen','画笔','Pen'],['highlight','高亮','Highlight'],['text','文字','Text'],['sticky','便签','Sticky note'],['eraser','橡皮','Eraser']].map(([id,zh,en])=>`<button type="button" class="note-icon-button" data-mode="${id}" aria-pressed="false" aria-label="${t(zh,en)}" title="${t(zh,en)}">${icon(id)}</button>`).join('')}<input type="color" data-color value="${color}" aria-label="${t('颜色','Color')}"><select data-width aria-label="${t('笔宽','Stroke width')}"><option value=".0015">${t('细','Fine')}</option><option value=".003" selected>${t('中','Medium')}</option><option value=".006">${t('粗','Broad')}</option></select>${button('undo','撤销','Undo')}${button('redo','重做','Redo')}<label><input type="checkbox" data-pen-only>${t('仅触控笔书写','Stylus only')}</label><span data-tool-status></span></div>
    <div class="note-navigation">${button('prev','上一页','Previous')}<input type="number" data-page min="1" value="1" aria-label="${t('页码','Page')}"><span data-total></span>${button('next','下一页','Next')}${button('zoom-out','缩小','Zoom out')}${button('zoom-in','放大','Zoom in')}${button('save','保存','Save')}${button('pdf','导出完整 PDF','Export PDF')}<button type="button" data-note="cancel-export" hidden>${t('取消导出','Cancel export')}</button>${button('focus','专注书写','Focus')}<details><summary>${t('更多','More')}</summary>${button('image','导出当前页图片','Export page image')}${button('backup','导出草稿','Export draft')}${button('reload','重新读取云端','Reload cloud')}</details></div>
    <div class="note-scroll"><div class="note-sheet"><canvas></canvas><svg class="note-ink" tabindex="0" aria-keyshortcuts="Delete Backspace" xmlns="http://www.w3.org/2000/svg" aria-label="${t('课件标注画布','Annotation canvas')}"></svg></div></div>
    <div data-sticky-tools class="note-sticky-tools" hidden inert aria-label="${t('便签操作','Sticky note actions')}">${button('sticky-text','编辑文字','Edit note text')}${button('sticky-copy','复制便签','Duplicate note')}${button('sticky-delete','删除便签','Delete note')}<label>${t('背景','Background')}<input type="color" data-sticky-color value="#fff2a8" aria-label="${t('便签背景颜色','Sticky note background')}"></label><span>${t('切换画笔可在便签上手写','Use the pen to write on the note')}</span></div>
    </div>
    <dialog data-filing-dialog><form method="dialog"><p></p><label>${t('归属课程','Destination course')}<select required></select></label><div><button value="cancel" formnovalidate>${t('取消','Cancel')}</button><button value="save">${t('归档并打开','File and open')}</button></div></form></dialog>
    <dialog data-text-dialog><form method="dialog"><label>${t('文字笔记（清空可删除）','Text note (empty to delete)')}<textarea maxlength="4000" rows="6"></textarea></label><div><button value="cancel">${t('取消','Cancel')}</button><button value="save">${t('完成','Done')}</button></div></form></dialog>`;
    bind();
  }
  async function mount(context) {
    if (host && (owner!==context.userId || !document.getElementById('courseNotesSlot'))) finishGesture(false);
    ctx=context;
    if (owner!==ctx.userId) {
      if(exportJob)exportJob.canceled=true;
      epoch++; saving=null; busy=false; stroke=null;selectedSticky=-1;
      clearTimeout(timer); if(pdf) void pdf.destroy(); host=null; pdf=null; course='';doc=''; dirty=false;owner=ctx.userId;items=[]; undo=[];redo=[];
    }
    const slot=document.getElementById('courseNotesSlot'); if(!slot || !owner) return;
    const nextLanguage = window.StudyBridgeI18n.getLanguage();
    if (host && language !== nextLanguage) {
      finishGesture(false);
      host = null; build();
      if (course) { await listDocuments(); $('[data-document]').value=doc; }
      if (pdf) { $('.note-work').hidden=false; await drawPage(); status(dirty ? t('未同步，草稿已保留','Unsynced; draft preserved') : t('本地示例','Saved to cloud')); }
    }
    language = nextLanguage;
    if (!host) build(); slot.replaceChildren(host);
    const select = $('[data-course]');
    select.innerHTML = `<option value="">${t('选择课程','Choose a course')}</option>` + ctx.courses.filter(c=>c.chatType!=='general' && c.name!=='Schedule & Deadlines').map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    select.value = course; syncPickers(); syncControls();
    if (!course && ctx.courseId) await openCourse(ctx.courseId);
  }
  window.addEventListener('beforeunload',e=>{finishGesture(false);if(dirty){backup();e.preventDefault();e.returnValue='';}});
  window.StudyBridgeCourseNotes={mount,openCourse};
})();
</script><script>
(async function(){
  const model=StudyBridgeNoteModel;
  let items=[
    {...model.sticky([.12,.11]),w:.3,h:.15,text:'导数与切线\nf′(a) 是曲线在 x = a 处的斜率。'},
    {...model.sticky([.58,.46]),w:.3,h:.16,text:'例题\nf(x) = x²，在 x = 2 处斜率为 4。'}
  ];
  const doc = {id:'blank', title:'导数与切线', blankNote:true};
  await StudyBridgeCourseNotes.mount({userId:'preview',courseId:'calc',courses:[{id:'calc',name:'AP Calculus AB'}], async api(url,options){
    if(url.includes('/documents?'))return {documents:[doc]};
    if(options?.method==='PUT')items=structuredClone(options.body.items);
    return {version:1,items:structuredClone(items)};
  }});
  const select=document.querySelector('[data-document]');select.value=doc.id;select.dispatchEvent(new Event('change',{bubbles:true}));
  const paper=document.querySelector('.note-scroll');
  function reset(){
    trial.restart();
    paper.scrollTop=Math.min(280,Math.max(0,(paper.scrollHeight-paper.clientHeight)*.55));
    window.scrollTo(0,window.scrollY+paper.getBoundingClientRect().top-document.querySelector('.hint').offsetHeight-14);
  }
  function start(){
    if(!paper.clientHeight || !paper.querySelector('[data-sticky]'))return requestAnimationFrame(start);
    document.querySelector('[data-mode=sticky]').click();
    reset();document.getElementById('restart').onclick=reset;
  }
  requestAnimationFrame(start);
})().catch(error=>{document.querySelector('.hint-inner span').textContent='示例加载失败：'+error.message;});
</script></html>
