<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyBridge Cloud</title>
<style>
  html,body,#root{min-height:100%;margin:0}
  body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:#eef5f9;color:#071b3a}
  .boot-screen{min-height:100vh;display:grid;place-items:center;text-align:center;gap:12px}
  .brand-mark{width:54px;height:54px;display:grid;place-items:center;border-radius:8px;background:linear-gradient(135deg,#174b63,#2c8067);color:#fff;font-weight:900;margin:auto}
  .boot-card{padding:24px;border:1px solid #cfdbeb;background:white;border-radius:8px;box-shadow:0 18px 50px rgba(7,27,58,.08);max-width:520px}
  .boot-card strong{font-size:28px;display:block}
  .boot-card p{color:#58708f;line-height:1.5}
  .error{color:#c44343;font-weight:800;white-space:pre-wrap}
</style>
</head>
<body>
<div id="root"><div class="boot-screen"><div class="boot-card"><div class="brand-mark">SB</div><strong>StudyBridge</strong><p>Opening StudyBridge...</p></div></div></div>
<script>
(async function(){
  "use strict";
  const VERSION = "1.1.36";
  const root = document.getElementById("root");
  const cacheKey = VERSION + "-" + Date.now();
  function esc(value){return String(value||"").replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
  function showFailure(error){
    root.innerHTML = '<div class="boot-screen"><div class="boot-card"><div class="brand-mark">SB</div><strong>StudyBridge failed to open</strong><p class="error">' + esc(error && error.message ? error.message : error) + '</p><p>请稍等一分钟后刷新；如果还失败，说明服务器还没有同步完整前端包。</p></div></div>';
  }
  async function fetchText(path){
    const res = await fetch(path + '?v=' + cacheKey, {cache:'no-store', credentials:'same-origin'});
    if(!res.ok) throw new Error(path + ' HTTP ' + res.status);
    return await res.text();
  }
  function cleanPart(text, path){
    const clean = String(text || '').replace(/\s+/g, '');
    if(!clean || clean.startsWith('<!doctype') || clean.startsWith('<html') || clean.startsWith('<')) throw new Error(path + ' 不是前端包文件，而是网页 fallback。');
    return clean;
  }
  function base64ToBytes(base64){
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  async function inflate(bytes){
    if(!('DecompressionStream' in window)) throw new Error('浏览器不支持前端包解压，请升级 Chrome。');
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  try {
    const css = await fetchText('/style.css').catch(() => '');
    if(css){ const style=document.createElement('style'); style.textContent=css; document.head.appendChild(style); }
    let b64 = '';
    for(let i=0;i<5;i++) b64 += cleanPart(await fetchText('/app.bundle.gz.b64.' + i), '/app.bundle.gz.b64.' + i);
    if(b64.length % 4 !== 0) throw new Error('前端包长度异常：' + b64.length);
    const source = await inflate(base64ToBytes(b64));
    (0, eval)(source + '\n//# sourceURL=studybridge-app-' + VERSION + '.js');
  } catch(error) {
    showFailure(error);
  }
})();
</script>
</body>
</html>
