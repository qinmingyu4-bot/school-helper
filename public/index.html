<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge Cloud</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .workspace {
        display: block;
        min-width: 0;
        height: 100vh;
        overflow: hidden;
      }

      #workspacePage {
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
        height: 100vh;
        min-height: 0;
      }

      #workspacePage[hidden] {
        display: none;
      }

      .profile-entry {
        display: grid;
        gap: 12px;
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        text-align: left;
        box-shadow: 0 8px 26px rgba(25, 36, 58, 0.05);
      }

      .profile-entry:hover {
        border-color: var(--green);
      }

      .profile-cover {
        display: flex;
        align-items: flex-end;
        min-height: 86px;
        padding: 10px;
        border-radius: 8px;
        background:
          linear-gradient(135deg, rgba(31, 58, 95, 0.82), rgba(47, 125, 98, 0.78)),
          linear-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px);
        background-position: center;
        background-size: cover, 22px 22px, 22px 22px;
      }

      .profile-avatar {
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border: 3px solid white;
        border-radius: 8px;
        background: linear-gradient(145deg, var(--navy), var(--green));
        background-position: center;
        background-size: cover;
        color: white;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(25, 36, 58, 0.18);
      }

      .profile-summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .profile-summary h3 {
        margin: 0 0 2px;
        font-size: 15px;
      }

      .profile-summary p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .profile-page {
        display: grid;
        grid-template-rows: auto 1fr;
        min-height: 100vh;
        background: #f4f6f9;
      }

      .profile-page[hidden] {
        display: none;
      }

      .profile-page-body {
        display: grid;
        grid-template-columns: minmax(260px, 360px) minmax(0, 1fr);
        gap: 18px;
        padding: 24px 28px;
      }

      .profile-preview-card,
      .profile-editor-panel {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: white;
        box-shadow: 0 12px 34px rgba(25, 36, 58, 0.06);
      }

      .profile-preview-card {
        overflow: hidden;
      }

      .profile-preview-cover {
        min-height: 180px;
        padding: 20px;
        background:
          linear-gradient(135deg, rgba(31, 58, 95, 0.86), rgba(47, 125, 98, 0.78)),
          linear-gradient(rgba(255, 255, 255, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
        background-position: center;
        background-size: cover, 24px 24px, 24px 24px;
      }

      .profile-preview-avatar {
        display: grid;
        place-items: center;
        width: 84px;
        height: 84px;
        margin-top: 108px;
        border: 4px solid white;
        border-radius: 8px;
        background: linear-gradient(145deg, var(--navy), var(--green));
        background-position: center;
        background-size: cover;
        color: white;
        font-size: 30px;
        font-weight: 900;
        box-shadow: 0 12px 26px rgba(25, 36, 58, 0.18);
      }

      .profile-preview-content {
        padding: 48px 20px 20px;
      }

      .profile-preview-content h3 {
        margin: 0 0 4px;
        font-size: 22px;
      }

      .profile-preview-content p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .profile-editor-panel {
        padding: 22px;
      }

      .profile-form {
        display: grid;
        gap: 14px;
        max-width: 680px;
      }

      .profile-form label {
        display: grid;
        gap: 7px;
        color: var(--navy);
        font-size: 13px;
        font-weight: 850;
      }

      .profile-form input[type="file"] {
        min-height: 44px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f7fafc;
      }

      .profile-actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .auth-inline-row,
      .file-upload-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px;
      }

      .auth-inline-row input,
      .file-upload-row input {
        min-width: 0;
      }

      .file-upload-row input[type="file"] {
        padding: 9px;
        border: 1px dashed #b9c6d8;
        border-radius: 8px;
        background: #f7fafc;
        font-size: 12px;
      }

      .code-button {
        min-height: 42px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #f7fafc;
        color: var(--navy);
        font-weight: 800;
        white-space: nowrap;
      }

      .code-button:disabled {
        opacity: 0.58;
      }

      .text-button {
        border: 0;
        background: transparent;
        color: var(--green);
        font-weight: 800;
        justify-self: center;
      }

      .chat {
        justify-content: flex-end;
        padding: 20px 28px 10px;
      }

      .quick-prompts {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 28px 0;
        overflow-x: auto;
        background: rgba(244, 246, 249, 0.96);
      }

      .quick-prompts span {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .quick-prompts button {
        flex: 0 0 auto;
        min-height: 34px;
        padding: 0 12px;
        border: 1px dashed #b9c6d8;
        border-radius: 8px;
        background: white;
        color: var(--navy);
        font-size: 13px;
        font-weight: 750;
      }

      .quick-prompts button:hover {
        border-style: solid;
        border-color: var(--green);
        color: var(--green);
      }

      .composer {
        padding-top: 10px;
      }

      @media (max-width: 900px) {
        .workspace,
        #workspacePage {
          height: auto;
          min-height: 680px;
        }
      }

      @media (max-width: 760px) {
        .profile-page-body {
          grid-template-columns: 1fr;
          padding: 16px;
        }

        .quick-prompts {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="auth-panel" id="authPanel">
        <div class="auth-decoration" aria-hidden="true">
          <span class="study-card card-one"></span>
          <span class="study-card card-two"></span>
          <span class="study-card card-three"></span>
        </div>
        <form class="auth-card" id="authForm">
          <div class="auth-card-heading">
            <div class="brand-mark">SB</div>
            <div>
              <p class="eyebrow">StudyBridge Cloud</p>
              <h1>StudyBridge</h1>
            </div>
          </div>
          <div class="tabs" role="tablist" aria-label="登录或注册">
            <button class="tab active" type="button" data-auth-mode="login">登录</button>
            <button class="tab" type="button" data-auth-mode="register">注册</button>
          </div>
          <label id="nameField" hidden>
            <span>姓名</span>
            <input id="nameInput" autocomplete="name" placeholder="你的名字" />
          </label>
          <label>
            <span>Email</span>
            <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label>
            <span>密码</span>
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="至少 8 位" required />
          </label>
          <label id="confirmPasswordField" hidden>
            <span>确认密码</span>
            <input id="passwordConfirmInput" type="password" autocomplete="new-password" placeholder="再输入一次密码" />
          </label>
          <label id="inviteField" hidden>
            <span>邀请码</span>
            <input id="inviteInput" autocomplete="one-time-code" placeholder="向创作者索取邀请码" />
          </label>
          <label id="emailCodeField" hidden>
            <span>邮箱验证码</span>
            <div class="auth-inline-row">
              <input id="emailCodeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 位验证码" />
              <button class="code-button" id="sendEmailCodeButton" type="button">发送验证码</button>
            </div>
          </label>
          <button class="primary-button" id="authSubmit" type="submit">登录</button>
          <button class="text-button" id="forgotPasswordButton" type="button">忘记密码？</button>
          <p class="form-message" id="authMessage"></p>
        </form>
      </section>

      <section class="app-shell" id="appShell" hidden>
        <aside class="sidebar">
          <header class="sidebar-header">
            <div class="brand-row compact">
              <div class="brand-mark">SB</div>
              <div>
                <h2>StudyBridge</h2>
                <p id="userLine">Cloud workspace</p>
              </div>
            </div>
            <button class="ghost-button" id="logoutButton" type="button">退出</button>
          </header>

          <button class="profile-entry" id="openProfilePageButton" type="button">
            <div class="profile-cover" id="profileCover">
              <div class="profile-avatar" id="profileAvatar">你</div>
            </div>
            <div class="profile-summary">
              <div>
                <h3 id="profileName">Personal profile</h3>
                <p id="profileSchool">添加学校后，AI 会更懂你的学习环境。</p>
              </div>
              <span class="small-button">打开</span>
            </div>
          </button>

          <nav class="role-switch" id="roleSwitch" aria-label="工作区切换" hidden>
            <button class="role-switch-button active" id="studentViewButton" type="button">普通用户端</button>
            <button class="role-switch-button" id="creatorViewButton" type="button">开发者端</button>
          </nav>

          <section class="panel">
            <div class="panel-title">
              <h3>课程</h3>
              <button class="small-button" id="addCourseButton" type="button">新增</button>
            </div>
            <div class="course-list" id="courseList"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h3>课程资料</h3>
              <span id="documentCount">0</span>
            </div>
            <textarea id="documentInput" placeholder="粘贴 syllabus、lecture notes、rubric、deadline 或样卷文字"></textarea>
            <div class="row">
              <input id="documentTitleInput" placeholder="资料标题" />
              <button class="small-button" id="saveDocumentButton" type="button">保存</button>
            </div>
            <div class="file-upload-row">
              <input id="documentFileInput" type="file" accept=".pdf,.txt,.md,text/plain,application/pdf" />
              <button class="small-button" id="uploadDocumentButton" type="button">上传文件</button>
            </div>
            <div class="document-list" id="documentList"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h3>Learning Style</h3>
              <span id="preferenceStatus">Saved</span>
            </div>
            <label class="check-row"><input id="englishTermsToggle" type="checkbox" checked />保留 English terms</label>
            <label class="check-row"><input id="englishAnswersToggle" type="checkbox" checked />做题先给 English answer</label>
            <label class="check-row"><input id="chineseExplanationsToggle" type="checkbox" checked />用中文解释 reasoning</label>
            <textarea id="customInstructionInput" placeholder="例如：先给结论，再用中文拆步骤，最后列考试易错点。"></textarea>
          </section>
        </aside>

        <section class="workspace">
          <section id="workspacePage">
            <header class="topbar">
              <div>
                <p class="eyebrow">Academic Coach</p>
                <h2 id="activeCourseTitle">请选择课程</h2>
                <span id="statusLine">资料、对话和偏好会通过后端保存。</span>
              </div>
              <select id="modeSelect" aria-label="学习模式">
                <option value="preview">预习</option>
                <option value="guided">带着学习</option>
                <option value="review">复习</option>
                <option value="assignment">作业辅助</option>
                <option value="exam">模拟出题</option>
                <option value="cheatsheet">Cheatsheet</option>
                <option value="cram">考前急救</option>
              </select>
            </header>

            <section class="developer-panel" id="developerPanel" hidden>
              <div class="panel-title">
                <div>
                  <p class="eyebrow">Creator Console</p>
                  <h3>开发者端</h3>
                </div>
                <button class="small-button" id="refreshAdminButton" type="button">刷新</button>
              </div>
              <form class="invite-form" id="inviteForm">
                <input id="inviteLabelInput" placeholder="备注：例如 Kevin / ECO101 小组" />
                <input id="inviteMaxUsesInput" type="number" min="1" max="100" value="1" aria-label="可使用次数" />
                <button class="small-button" type="submit">生成邀请码</button>
              </form>
              <p class="form-message" id="adminMessage"></p>
              <div class="admin-grid">
                <div>
                  <h4>邀请码</h4>
                  <div class="invite-list" id="inviteList"></div>
                </div>
                <div>
                  <h4>学生数据</h4>
                  <div class="user-list" id="userList"></div>
                </div>
              </div>
            </section>

            <div class="chat" id="chatArea"></div>

            <section class="quick-prompts" id="quickPrompts" aria-label="快捷指令">
              <span>快捷指令</span>
              <button type="button" data-quick-prompt="帮我根据这门课资料预习下一节课，先列重点，再给我该看的 English terms。">预习下一节</button>
              <button type="button" data-quick-prompt="帮我整理这门课最重要的课前关键词，保留 English terms，并用中文解释。">课前关键词</button>
              <button type="button" data-quick-prompt="根据目前课程资料，帮我生成可以在课堂上提问的高质量问题。">上课问题</button>
              <button type="button" data-quick-prompt="我只有 10 分钟，帮我快速预习这门课当前资料。">10 分钟预习</button>
              <button type="button" data-quick-prompt="帮我总结这门课的课程介绍、学习目标和评分重点。">课程介绍</button>
              <button type="button" data-quick-prompt="帮我从课程资料里汇总所有 deadline、考试、作业和重要日期。">Deadline 汇总</button>
            </section>

            <form class="composer" id="chatForm">
              <textarea id="messageInput" rows="1" placeholder="问：帮我根据这门课资料做一个 final 复习计划"></textarea>
              <button class="send-button" id="sendButton" type="submit">发送</button>
            </form>
          </section>

          <section class="profile-page" id="profilePage" hidden>
            <header class="topbar">
              <div>
                <p class="eyebrow">Personal Profile</p>
                <h2>个人资料</h2>
                <span>学校信息会进入 AI 上下文，让回答更贴近你的课程环境。</span>
              </div>
              <button class="ghost-button" id="backToStudyButton" type="button">返回学习区</button>
            </header>
            <div class="profile-page-body">
              <article class="profile-preview-card">
                <div class="profile-preview-cover" id="profilePreviewCover">
                  <div class="profile-preview-avatar" id="profilePreviewAvatar">你</div>
                </div>
                <div class="profile-preview-content">
                  <h3 id="profilePreviewName">StudyBridge user</h3>
                  <p id="profilePreviewSchool">还没有填写学校。</p>
                </div>
              </article>
              <section class="profile-editor-panel">
                <form class="profile-form" id="profileForm">
                  <label>
                    <span>名字</span>
                    <input id="profileNameInput" placeholder="你的名字" />
                  </label>
                  <label>
                    <span>学校</span>
                    <input id="schoolInput" placeholder="例如 University of Toronto / UBC / NYU" />
                  </label>
                  <label>
                    <span>头像图片</span>
                    <input id="avatarFileInput" type="file" accept="image/*" />
                  </label>
                  <label>
                    <span>背景图片</span>
                    <input id="backgroundFileInput" type="file" accept="image/*" />
                  </label>
                  <input id="avatarUrlInput" type="hidden" />
                  <input id="backgroundUrlInput" type="hidden" />
                  <div class="profile-actions">
                    <button class="primary-button" type="submit">保存资料</button>
                    <button class="ghost-button" id="clearProfileImagesButton" type="button">清空图片</button>
                  </div>
                  <p class="form-message" id="profileMessage"></p>
                </form>
              </section>
            </div>
          </section>
        </section>
      </section>
    </main>
    <script src="/app.js?v=20261008-1.0.97"></script>
    <script src="/google-auth-patch.js?v=20261008-1.0.97"></script>
  </body>
</html>
