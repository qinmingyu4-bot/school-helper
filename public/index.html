<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge Cloud</title>
    <link rel="stylesheet" href="/style.css" />
    <style>
      .quick-prompts {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 28px 0;
        overflow-x: auto;
        background: rgba(244, 246, 249, 0.96);
      }

      .quick-prompts span {
        flex: 0 0 auto;
        color: var(--muted);
        font-size: 12px;
        font-weight: 850;
      }

      .quick-prompts button {
        flex: 0 0 auto;
        min-height: 34px;
        padding: 0 12px;
        border: 1px dashed #b9c6d8;
        border-radius: 8px;
        background: white;
        color: var(--navy);
        font-size: 13px;
        font-weight: 750;
      }

      .quick-prompts button:hover {
        border-style: solid;
        border-color: var(--green);
        color: var(--green);
      }

      @media (max-width: 560px) {
        .quick-prompts {
          padding-left: 16px;
          padding-right: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="auth-panel" id="authPanel">
        <div class="auth-decoration" aria-hidden="true">
          <span class="study-card card-one"></span>
          <span class="study-card card-two"></span>
          <span class="study-card card-three"></span>
        </div>
        <form class="auth-card" id="authForm">
          <div class="auth-card-heading">
            <div class="brand-mark">SB</div>
            <div>
              <p class="eyebrow">StudyBridge Cloud</p>
              <h1>StudyBridge</h1>
            </div>
          </div>
          <div class="tabs" role="tablist" aria-label="登录或注册">
            <button class="tab active" type="button" data-auth-mode="login">登录</button>
            <button class="tab" type="button" data-auth-mode="register">注册</button>
          </div>
          <label id="nameField" hidden>
            <span>姓名</span>
            <input id="nameInput" autocomplete="name" placeholder="你的名字" />
          </label>
          <label>
            <span>Email</span>
            <input id="emailInput" type="email" autocomplete="email" placeholder="you@example.com" required />
          </label>
          <label>
            <span>密码</span>
            <input id="passwordInput" type="password" autocomplete="current-password" placeholder="至少 8 位" required />
          </label>
          <label id="inviteField" hidden>
            <span>邀请码</span>
            <input id="inviteInput" autocomplete="one-time-code" placeholder="向创作者索取邀请码" />
          </label>
          <button class="primary-button" id="authSubmit" type="submit">登录</button>
          <p class="form-message" id="authMessage"></p>
        </form>
      </section>

      <section class="app-shell" id="appShell" hidden>
        <aside class="sidebar">
          <header class="sidebar-header">
            <div class="brand-row compact">
              <div class="brand-mark">SB</div>
              <div>
                <h2>StudyBridge</h2>
                <p id="userLine">Cloud workspace</p>
              </div>
            </div>
            <button class="ghost-button" id="logoutButton" type="button">退出</button>
          </header>

          <nav class="role-switch" id="roleSwitch" aria-label="工作区切换" hidden>
            <button class="role-switch-button active" id="studentViewButton" type="button">普通用户端</button>
            <button class="role-switch-button" id="creatorViewButton" type="button">开发者端</button>
          </nav>

          <section class="panel">
            <div class="panel-title">
              <h3>课程</h3>
              <button class="small-button" id="addCourseButton" type="button">新增</button>
            </div>
            <div class="course-list" id="courseList"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h3>课程资料</h3>
              <span id="documentCount">0</span>
            </div>
            <textarea id="documentInput" placeholder="粘贴 syllabus、lecture notes、rubric、deadline 或样卷文字"></textarea>
            <div class="row">
              <input id="documentTitleInput" placeholder="资料标题" />
              <button class="small-button" id="saveDocumentButton" type="button">保存</button>
            </div>
            <div class="document-list" id="documentList"></div>
          </section>

          <section class="panel">
            <div class="panel-title">
              <h3>Learning Style</h3>
              <span id="preferenceStatus">Saved</span>
            </div>
            <label class="check-row"><input id="englishTermsToggle" type="checkbox" checked />保留 English terms</label>
            <label class="check-row"><input id="englishAnswersToggle" type="checkbox" checked />做题先给 English answer</label>
            <label class="check-row"><input id="chineseExplanationsToggle" type="checkbox" checked />用中文解释 reasoning</label>
            <textarea id="customInstructionInput" placeholder="例如：先给结论，再用中文拆步骤，最后列考试易错点。"></textarea>
          </section>
        </aside>

        <section class="workspace">
          <header class="topbar">
            <div>
              <p class="eyebrow">Academic Coach</p>
              <h2 id="activeCourseTitle">请选择课程</h2>
              <span id="statusLine">资料、对话和偏好会通过后端保存。</span>
            </div>
            <select id="modeSelect" aria-label="学习模式">
              <option value="preview">预习</option>
              <option value="guided">带着学习</option>
              <option value="review">复习</option>
              <option value="assignment">作业辅助</option>
              <option value="exam">模拟出题</option>
              <option value="cheatsheet">Cheatsheet</option>
              <option value="cram">考前急救</option>
            </select>
          </header>

          <section class="developer-panel" id="developerPanel" hidden>
            <div class="panel-title">
              <div>
                <p class="eyebrow">Creator Console</p>
                <h3>开发者端</h3>
              </div>
              <button class="small-button" id="refreshAdminButton" type="button">刷新</button>
            </div>
            <form class="invite-form" id="inviteForm">
              <input id="inviteLabelInput" placeholder="备注：例如 Kevin / ECO101 小组" />
              <input id="inviteMaxUsesInput" type="number" min="1" max="100" value="1" aria-label="可使用次数" />
              <button class="small-button" type="submit">生成邀请码</button>
            </form>
            <p class="form-message" id="adminMessage"></p>
            <div class="admin-grid">
              <div>
                <h4>邀请码</h4>
                <div class="invite-list" id="inviteList"></div>
              </div>
              <div>
                <h4>学生数据</h4>
                <div class="user-list" id="userList"></div>
              </div>
            </div>
          </section>

          <div class="chat" id="chatArea"></div>

          <section class="quick-prompts" id="quickPrompts" aria-label="快捷指令">
            <span>快捷指令</span>
            <button type="button" data-quick-prompt="帮我根据这门课资料预习下一节课，先列重点，再给我该看的 English terms。">预习下一节</button>
            <button type="button" data-quick-prompt="帮我整理这门课最重要的课前关键词，保留 English terms，并用中文解释。">课前关键词</button>
            <button type="button" data-quick-prompt="根据目前课程资料，帮我生成可以在课堂上提问的高质量问题。">上课问题</button>
            <button type="button" data-quick-prompt="我只有 10 分钟，帮我快速预习这门课当前资料。">10 分钟预习</button>
            <button type="button" data-quick-prompt="帮我总结这门课的课程介绍、学习目标和评分重点。">课程介绍</button>
            <button type="button" data-quick-prompt="帮我从课程资料里汇总所有 deadline、考试、作业和重要日期。">Deadline 汇总</button>
          </section>

          <form class="composer" id="chatForm">
            <textarea id="messageInput" rows="1" placeholder="问：帮我根据这门课资料做一个 final 复习计划"></textarea>
            <button class="send-button" id="sendButton" type="submit">发送</button>
          </form>
        </section>
      </section>
    </main>
    <script src="/app.js"></script>
    <script>
      document.querySelectorAll("[data-quick-prompt]").forEach((button) => {
        button.addEventListener("click", () => {
          const input = document.querySelector("#messageInput");
          if (!input) return;
          input.value = button.dataset.quickPrompt || "";
          input.focus();
        });
      });
    </script>
  </body>
</html>
