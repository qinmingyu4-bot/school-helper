<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyBridge Cloud</title>
    <style>
      :root { --ink:#071b3a; --muted:#58708f; --line:#cfdbeb; --green:#2c8067; --teal:#174b63; }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; color:var(--ink); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; background:linear-gradient(rgba(237,244,249,.92),rgba(237,244,249,.92)),linear-gradient(90deg,rgba(20,75,99,.07) 1px,transparent 1px),linear-gradient(rgba(20,75,99,.07) 1px,transparent 1px); background-size:auto,34px 34px,34px 34px; }
      .boot-screen,.auth-shell { min-height:100vh; display:grid; place-items:center; padding:24px; }
      .auth-card { width:min(460px, calc(100vw - 32px)); background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 18px 50px rgba(7,27,58,.08); padding:24px; }
      .brand-row { display:flex; gap:14px; align-items:center; margin-bottom:16px; }
      .brand-mark { width:52px; height:52px; border-radius:8px; display:grid; place-items:center; background:linear-gradient(135deg,var(--teal),var(--green)); color:white; font-weight:900; }
      .brand-row span { display:block; color:#08704f; font-weight:900; font-size:12px; letter-spacing:.04em; }
      .brand-row strong { font-size:28px; line-height:1; }
      .notice { line-height:1.6; color:var(--muted); }
      .primary { border:0; border-radius:8px; background:linear-gradient(135deg,#24496f,#2c8067); color:white; font-weight:900; padding:12px 16px; cursor:pointer; }
      .wide { width:100%; }
      .muted { color:var(--muted); font-size:13px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <section class="auth-card">
          <div class="brand-row">
            <div class="brand-mark">SB</div>
            <div><span>STUDYBRIDGE CLOUD</span><strong>StudyBridge</strong></div>
          </div>
          <p class="notice">正在打开 StudyBridge...</p>
        </section>
      </div>
    </div>
    <script>
      (async function () {
        "use strict";
        const VERSION = "1.1.36";
        const GH = "https://raw.githubusercontent.com/qinmingyu4-bot/school-helper/main/public/";
        const root = document.getElementById("root");
        function escapeHtml(value) {
          return String(value || "").replace(/[&<>"']/g, (char) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
        }
        function showFailure(error) {
          const message = error && error.message ? error.message : String(error || "unknown error");
          console.error(error);
          root.innerHTML = `<main class="auth-shell"><section class="auth-card"><div class="brand-row"><div class="brand-mark">SB</div><div><span>STUDYBRIDGE CLOUD</span><strong>StudyBridge</strong></div></div><p class="notice"><b>StudyBridge failed to open</b><br>${escapeHtml(message)}</p><p class="muted">请刷新页面。如果仍然失败，说明服务器没有拿到最新前端包。</p><button class="primary wide" onclick="location.reload()">刷新页面</button></section></main>`;
        }
        function base64ToBytes(base64) {
          const clean = String(base64 || "").replace(/\s+/g, "");
          if (clean.startsWith("<")) throw new Error("Bundle URL returned HTML instead of app code.");
          const binary = atob(clean);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) bytes[i] = binary.charCodeAt(i);
          return bytes;
        }
        async function inflateGzip(bytes) {
          if (typeof DecompressionStream === "undefined") throw new Error("当前浏览器不支持 StudyBridge 启动器，请升级 Chrome。");
          const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
          return await new Response(stream).text();
        }
        async function text(url) {
          const res = await fetch(url, { cache: "no-store" });
          if (!res.ok) throw new Error(`${url} HTTP ${res.status}`);
          return await res.text();
        }
        try {
          const style = await text(`${GH}style.css?v=${VERSION}-${Date.now()}`);
          const tag = document.createElement("style");
          tag.textContent = style;
          document.head.appendChild(tag);
          const b64 = await text(`${GH}app.bundle.gz.b64?v=${VERSION}-${Date.now()}`);
          const source = await inflateGzip(base64ToBytes(b64));
          (0, eval)(`${source}\n//# sourceURL=studybridge-app-${VERSION}.js`);
        } catch (error) {
          showFailure(error);
        }
      })();
    </script>
  </body>
</html>
