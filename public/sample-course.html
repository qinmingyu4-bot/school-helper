<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="免登录体验 StudyBridge 示例课：阅读课程资料、核对答疑引用、完成练习并查看反馈。">
  <title>示例课 · StudyBridge</title>
  <link rel="icon" href="/brand/icon-monochrome.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/typography.css">
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/display-modes.css">
  <link rel="stylesheet" href="/sample-course.css">
  <script src="/i18n-en.js" defer></script>
  <script src="/i18n.js" defer></script>
  <script src="/sample-course-content.js" defer></script>
  <script src="/sample-course.js" defer></script>
</head>
<body class="sample-course">
  <header class="sample-header">
    <div class="sample-wrap sample-header-inner">
      <a class="sample-brand" href="/"><img src="/brand/book-bridge-monochrome.svg" width="31" height="18" alt=""><span>StudyBridge</span></a>
      <div class="sample-header-actions">
        <label class="sample-language">
          <span class="sample-sr-only" id="sample-language-label">界面语言</span>
          <select data-interface-language aria-labelledby="sample-language-label">
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <button class="sample-theme" type="button" id="sample-theme"></button>
      </div>
    </div>
  </header>
  <main id="sample-main" class="sample-wrap">
    <noscript>请开启 JavaScript 体验互动示例课。 Enable JavaScript to try the interactive sample course.</noscript>
    <div id="sample-app"></div>
  </main>
  <dialog id="sample-source-dialog" aria-labelledby="sample-source-title"></dialog>
</body>
</html>
